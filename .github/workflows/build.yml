name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 还原签名密钥
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arc-pingpong.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/arc-pingpong.p12" >> "$GITHUB_ENV"

      - name: 构建正式签名版
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --console=plain

      - name: 无密钥时构建调试版
        if: env.KEYSTORE_B64 == ''
        run: gradle assembleDebug --no-daemon --console=plain

      - name: 收集 APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ArcPingPong.apk
            echo "使用正式签名 APK"
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ArcPingPong.apk
            echo "使用调试签名 APK"
          else
            echo "找不到 APK 产物"
            exit 1
          fi
          ls -lh ArcPingPong.apk
          sha256sum ArcPingPong.apk

      - name: 校验签名
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs ArcPingPong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArcPingPong-apk
          path: ArcPingPong.apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 弧光乒乓 #${{ github.run_number }}
          files: ArcPingPong.apk
          body: |
            单文件乒乓球模拟经营游戏《弧光乒乓 · 俱乐部物语》的 Android 安装包。

            - 应用：弧光乒乓
            - 包名：com.lvjunrui.arcpingpong
            - 版本：1.0.0
            - 无需联网，存档保存在本机 WebView
