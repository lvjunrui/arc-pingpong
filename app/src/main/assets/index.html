<script>
/* 球台与比赛画面：Canvas 2D 伪 3D */
(function () {
  'use strict';

  const V = {
    canvas: null, ctx: null, W: 0, H: 0, dpr: 1,
    running: false, raf: 0, last: 0, speed: 1,
    match: null,
    players: {
      A: { x: 0, tx: 0, swing: 0 },
      B: { x: 0, tx: 0, swing: 0 }
    },
    anim: null, trail: [], particles: [], crowd: [],
    lastNow: 0, celebrateUntil: 0
  };

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function geom() {
    const W = V.W, H = V.H;
    return {
      cx: W / 2,
      top: H * 0.19,
      bottom: H * 0.715,
      farW: W * 0.225,
      nearW: W * 0.475,
      zScale: H * 0.27
    };
  }

  function proj(x, y, z) {
    const g = geom();
    const py = g.top + (g.bottom - g.top) * y;
    const hw = g.farW + (g.nearW - g.farW) * y;
    const depth = 0.72 + 0.38 * y;
    return {
      x: g.cx + x * hw,
      y: py - (z || 0) * g.zScale * depth,
      py: py,
      s: depth
    };
  }

  function anchor(side, x) {
    const near = side === 'A';
    return {
      x: V.W / 2 + clamp(x, -1.08, 1.08) * (near ? V.W * 0.405 : V.W * 0.19),
      feetY: near ? V.H * 0.93 : V.H * 0.135,
      h: near ? V.H * 0.205 : V.H * 0.112,
      near
    };
  }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function initCanvas(canvas, match) {
    V.canvas = canvas;
    V.ctx = canvas.getContext('2d');
    V.match = match;
    V.players.A = { x: 0, tx: 0, swing: 0 };
    V.players.B = { x: 0, tx: 0, swing: 0 };
    V.trail = [];
    V.particles = [];
    buildCrowd();
    resize();
    if (typeof ResizeObserver !== 'undefined') {
      if (V.ro) V.ro.disconnect();
      V.ro = new ResizeObserver(() => resize());
      V.ro.observe(canvas.parentElement);
    }
    start();
  }

  function resize() {
    if (!V.canvas) return;
    const r = V.canvas.parentElement.getBoundingClientRect();
    if (!r.width || !r.height) return;
    V.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    V.W = r.width;
    V.H = r.height;
    V.canvas.width = Math.round(V.W * V.dpr);
    V.canvas.height = Math.round(V.H * V.dpr);
    V.canvas.style.width = V.W + 'px';
    V.canvas.style.height = V.H + 'px';
    V.ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  }

  function buildCrowd() {
    V.crowd = [];
    const rng = (function (a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })(20261122);
    const colors = ['#3f5f8a', '#2f7d76', '#7d5a45', '#59648c', '#8a4b57', '#33506b'];
    for (let row = 0; row < 7; row++) {
      const y = 0.026 + row * 0.018;
      const count = 34 + row * 5;
      for (let i = 0; i < count; i++) {
        V.crowd.push({
          x: rng(), y: y + rng() * 0.012,
          r: 0.8 + rng() * 1.7,
          c: colors[Math.floor(rng() * colors.length)],
          ph: rng() * Math.PI * 2,
          a: 0.18 + rng() * 0.38
        });
      }
    }
  }

  function start() {
    if (V.running) return;
    V.running = true;
    V.last = performance.now();
    V.raf = requestAnimationFrame(loop);
  }

  function stop() {
    V.running = false;
    if (V.raf) cancelAnimationFrame(V.raf);
    V.raf = 0;
    if (V.anim && !V.anim.done) {
      V.anim.done = true;
      const r = V.anim.resolve;
      V.anim = null;
      if (r) r();
    }
  }

  function loop(now) {
    if (!V.running) return;
    const dt = Math.min((now - V.last) / 1000, 0.06);
    V.last = now;
    V.now = now / 1000;
    update(dt);
    if (V.W && V.H) draw(V.now);
    V.raf = requestAnimationFrame(loop);
  }

  /* ---------------- 动画时间线 ---------------- */

  const KIND_ARC = { serve: 0.30, loop: 0.52, drive: 0.38, smash: 0.17, push: 0.24, chop: 0.62 };

  function buildTimeline(pt) {
    const segs = [], events = [];
    let t = 0;

    let tossed = false;
    for (const shot of pt.shots) {
      if (shot.isServe && !tossed) {
        tossed = true;
        const a = { x: shot.from.x, y: shot.from.y, z: 0.30 };
        segs.push({ a, b: { x: a.x, y: a.y, z: 0.30 }, arc: 0.20, dur: 0.34, tag: 'toss', kind: 'serve' });
        t += 0.34;
      }
      events.push({ t, type: 'hit', shot, side: shot.hitter });
      let cur = { x: shot.from.x, y: shot.from.y, z: 0.30 };
      const path = [];
      for (const b of shot.bounces) path.push({ x: b.x, y: b.y, z: 0, tag: 'bounce' });
      if (shot.end === 'net') path.push({ x: shot.net.x, y: shot.net.y, z: 0.105, tag: 'net' });
      if (shot.contact) path.push({ x: shot.contact.x, y: shot.contact.y, z: 0.30, tag: 'contact' });
      if (shot.out) path.push({ x: shot.out.x, y: shot.out.y, z: 0.03, tag: 'out' });
      if (shot.end === 'net') path.push({ x: shot.net.x, y: shot.net.y, z: 0, tag: 'floor' });

      const weights = path.map((p) => {
        const d = Math.hypot(p.x - cur.x, (p.y - cur.y) * 1.35) + Math.abs(p.z - cur.z) * 0.4;
        return 0.22 + d;
      });
      const sum = weights.reduce((a, b) => a + b, 0) || 1;

      for (let i = 0; i < path.length; i++) {
        const p = path[i];
        const dur = Math.max(0.08, shot.duration * (weights[i] / sum));
        let arc = KIND_ARC[shot.kind] || 0.4;
        if (i > 0) arc = p.tag === 'out' ? 0.10 : p.tag === 'floor' ? 0 : 0.28;
        if (shot.kind === 'smash' && i > 0) arc = 0.14;
        if (shot.isServe && i === 0) arc = 0.16;
        if (shot.isServe && i === 1) arc = 0.22;
        if (p.tag === 'contact' && i > 0) arc = 0.34;
        if (p.tag === 'net' && shot.end === 'net') arc = 0.04;
        segs.push({ a: cur, b: p, arc, dur, tag: p.tag, kind: shot.kind });
        t += dur;
        if (p.tag === 'bounce' || p.tag === 'out' || p.tag === 'net') {
          events.push({ t, type: p.tag, p, side: shot.hitter });
        }
        cur = p;
      }
    }
    return { segs, events, total: t, pt, elapsed: 0, ei: 0, done: false, hold: 0.62, resolve: null };
  }

  function playPoint(pt) {
    if (V.anim && !V.anim.done) {
      V.anim.done = true;
      const old = V.anim.resolve;
      V.anim = null;
      if (old) old();
    }
    V.trail = [];
    const anim = buildTimeline(pt);
    return new Promise((resolve) => {
      anim.resolve = resolve;
      V.anim = anim;
    });
  }

  function update(dt) {
    const pA = V.players.A, pB = V.players.B;
    const rate = Math.min(1, dt * 9);
    pA.x += (pA.tx - pA.x) * rate;
    pB.x += (pB.tx - pB.x) * rate;
    pA.swing = Math.max(0, pA.swing - dt * 3.2);
    pB.swing = Math.max(0, pB.swing - dt * 3.2);

    for (const p of V.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 320 * dt;
      p.life -= dt;
    }
    V.particles = V.particles.filter((p) => p.life > 0);

    for (const tr of V.trail) tr.life -= dt;
    V.trail = V.trail.filter((t) => t.life > 0);

    const a = V.anim;
    if (!a || a.done) return;
    a.elapsed += dt * V.speed;

    while (a.ei < a.events.length && a.events[a.ei].t <= a.elapsed) {
      const ev = a.events[a.ei++];
      if (ev.type === 'hit') {
        const side = ev.shot.hitter;
        V.players[side].swing = 1;
        V.players[side].tx = clamp(ev.shot.from.x, -1, 1);
        const recv = side === 'A' ? 'B' : 'A';
        const target = ev.shot.bounces[0] || ev.shot.net || ev.shot.out || { x: 0 };
        V.players[recv].tx = clamp(target.x, -0.95, 0.95);
        if (window.Sound) window.Sound.hit(ev.shot.kind);
      } else if (ev.type === 'bounce' || ev.type === 'out') {
        spawnDust(ev.p, 5);
        if (window.Sound) window.Sound.bounce();
      } else if (ev.type === 'net') {
        spawnDust(ev.p, 8);
        if (window.Sound) window.Sound.bounce();
      }
    }

    const ball = ballAt(a.elapsed);
    if (ball && !a.done && a.elapsed < a.total + 0.15) {
      V.trail.push({ x: ball.x, y: ball.y, r: ball.r, life: 0.22, max: 0.22 });
    }
    while (V.trail.length > 18) V.trail.shift();

    if (a.elapsed > a.total + a.hold && !a.done) {
      a.done = true;
      const r = a.resolve;
      V.anim = null;
      if (r) r();
    }
  }

  function ballAt(elapsed) {
    const a = V.anim;
    if (!a || !a.segs.length) return null;
    let acc = 0;
    for (const seg of a.segs) {
      if (elapsed <= acc + seg.dur) {
        const u = clamp((elapsed - acc) / seg.dur, 0, 1);
        const x = seg.a.x + (seg.b.x - seg.a.x) * u;
        const y = seg.a.y + (seg.b.y - seg.a.y) * u;
        const z = seg.a.z + (seg.b.z - seg.a.z) * u + seg.arc * 4 * u * (1 - u);
        const p = proj(x, y, z);
        const r = clamp(3.2 + 3.2 * p.s, 3.5, 7.2);
        return { x: p.x, y: p.y, worldX: x, worldY: y, z, r, u };
      }
      acc += seg.dur;
    }
    const last = a.segs[a.segs.length - 1].b;
    const p = proj(last.x, last.y, last.z);
    return { x: p.x, y: p.y, worldX: last.x, worldY: last.y, z: last.z, r: 4.5, u: 1 };
  }

  function spawnDust(p, n) {
    const s = proj(p.x, p.y, 0.02);
    for (let i = 0; i < n; i++) {
      V.particles.push({
        x: s.x, y: s.y,
        vx: (Math.random() - 0.5) * 60,
        vy: -Math.random() * 45,
        r: 1 + Math.random() * 1.8,
        life: 0.3 + Math.random() * 0.3,
        max: 0.6,
        c: 'rgba(180, 240, 225,'
      });
    }
  }

  function celebrate(win) {
    const colors = win ? ['#2fe0c0', '#ffd166', '#ffffff', '#6ea8ff'] : ['#ff6174', '#8ea5c6'];
    for (let i = 0; i < 70; i++) {
      V.particles.push({
        x: Math.random() * V.W,
        y: V.H * (0.2 + Math.random() * 0.2),
        vx: (Math.random() - 0.5) * 90,
        vy: -Math.random() * 120,
        r: 1.5 + Math.random() * 2.6,
        life: 1.2 + Math.random(),
        max: 2.2,
        c: colors[Math.floor(Math.random() * colors.length)],
        confetti: true
      });
    }
    V.celebrateUntil = V.now + 2;
  }

  /* ---------------- 绘制 ---------------- */

  function draw(t) {
    const c = V.ctx, W = V.W, H = V.H;
    c.clearRect(0, 0, W, H);
    drawBackground(t);
    drawCrowd(t);
    drawPlayer('B', t);
    drawTable();
    drawNet();
    drawPlayer('A', t);
    drawBallAndTrail();
    drawParticles();
  }

  function drawBackground(t) {
    const c = V.ctx, W = V.W, H = V.H;
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#040812');
    g.addColorStop(0.45, '#081426');
    g.addColorStop(0.78, '#06101d');
    g.addColorStop(1, '#03060b');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    let s = c.createRadialGradient(W * 0.18, -H * 0.05, 10, W * 0.18, -H * 0.05, W * 0.75);
    s.addColorStop(0, 'rgba(57, 115, 190, .22)');
    s.addColorStop(1, 'rgba(57, 115, 190, 0)');
    c.fillStyle = s;
    c.fillRect(0, 0, W, H);

    s = c.createRadialGradient(W * 0.86, -H * 0.02, 10, W * 0.86, -H * 0.02, W * 0.7);
    s.addColorStop(0, 'rgba(38, 180, 160, .14)');
    s.addColorStop(1, 'rgba(38, 180, 160, 0)');
    c.fillStyle = s;
    c.fillRect(0, 0, W, H);

    // 光束
    c.save();
    c.globalAlpha = 0.05;
    c.fillStyle = '#bfe8ff';
    c.beginPath();
    c.moveTo(W * 0.34, 0); c.lineTo(W * 0.24, H * 0.7); c.lineTo(W * 0.38, H * 0.7); c.lineTo(W * 0.46, 0);
    c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(W * 0.66, 0); c.lineTo(W * 0.76, H * 0.7); c.lineTo(W * 0.62, H * 0.7); c.lineTo(W * 0.54, 0);
    c.closePath(); c.fill();
    c.restore();

    // 场馆灯带
    c.save();
    c.globalAlpha = 0.35;
    c.strokeStyle = 'rgba(120, 190, 255, .5)';
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, H * 0.018); c.lineTo(W, H * 0.018); c.stroke();
    c.restore();

    // 顶部赛事字
    c.save();
    c.globalAlpha = 0.5;
    c.fillStyle = '#9fc9e8';
    c.font = `700 ${Math.max(8, W * 0.022)}px system-ui, sans-serif`;
    c.textAlign = 'center';
    if (c.letterSpacing !== undefined) c.letterSpacing = '4px';
    c.fillText('ARC OPEN  ·  弧光杯', W / 2, H * 0.052);
    c.restore();

    // 地板
    const fy = geom().bottom;
    const fg = c.createLinearGradient(0, fy, 0, H);
    fg.addColorStop(0, 'rgba(10, 25, 38, .9)');
    fg.addColorStop(1, 'rgba(3, 7, 12, 1)');
    c.fillStyle = fg;
    c.fillRect(0, fy, W, H - fy);
  }

  function drawCrowd(t) {
    const c = V.ctx, W = V.W, H = V.H;
    c.save();
    for (const p of V.crowd) {
      const tw = 0.75 + 0.25 * Math.sin(t * 0.8 + p.ph);
      c.globalAlpha = p.a * tw;
      c.fillStyle = p.c;
      c.beginPath();
      c.arc(p.x * W, p.y * H, p.r * (W / 430), 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
    // 观众席暗部
    const g = c.createLinearGradient(0, H * 0.1, 0, H * 0.18);
    g.addColorStop(0, 'rgba(3,7,13,0)');
    g.addColorStop(1, 'rgba(3,7,13,.85)');
    c.fillStyle = g;
    c.fillRect(0, H * 0.1, W, H * 0.08);
  }

  function drawTable() {
    const c = V.ctx;
    const fl = proj(-1, 0), fr = proj(1, 0), nr = proj(1, 1), nl = proj(-1, 1);
    const g = geom();

    // 桌腿
    c.save();
    c.strokeStyle = 'rgba(7, 16, 26, .95)';
    c.lineWidth = Math.max(5, V.W * 0.016);
    c.beginPath();
    c.moveTo(nl.x + 8, nl.y + 4); c.lineTo(nl.x + 12, nl.y + V.H * 0.075);
    c.moveTo(nr.x - 8, nr.y + 4); c.lineTo(nr.x - 12, nr.y + V.H * 0.075);
    c.stroke();
    c.restore();

    // 台面阴影
    c.save();
    c.fillStyle = 'rgba(0, 0, 0, .35)';
    c.beginPath();
    c.moveTo(fl.x, fl.y + 12); c.lineTo(fr.x, fr.y + 12);
    c.lineTo(nr.x, nr.y + 16); c.lineTo(nl.x, nl.y + 16);
    c.closePath(); c.fill();
    c.restore();

    // 近端台沿（厚度）
    c.fillStyle = '#042f2a';
    c.beginPath();
    c.moveTo(nl.x, nl.y); c.lineTo(nr.x, nr.y);
    c.lineTo(nr.x, nr.y + 9); c.lineTo(nl.x, nl.y + 9);
    c.closePath(); c.fill();

    // 台面
    const grad = c.createLinearGradient(0, fl.y, 0, nl.y);
    grad.addColorStop(0, '#0d6156');
    grad.addColorStop(0.55, '#0a5149');
    grad.addColorStop(1, '#073d38');
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(fl.x, fl.y); c.lineTo(fr.x, fr.y);
    c.lineTo(nr.x, nr.y); c.lineTo(nl.x, nl.y);
    c.closePath(); c.fill();

    // 高光
    c.save();
    c.globalAlpha = 0.06;
    const sh = c.createLinearGradient(fl.x, fl.y, nr.x, nr.y);
    sh.addColorStop(0, 'rgba(255,255,255,.8)');
    sh.addColorStop(0.45, 'rgba(255,255,255,0)');
    c.fillStyle = sh;
    c.beginPath();
    c.moveTo(fl.x, fl.y); c.lineTo(fr.x, fr.y);
    c.lineTo(nr.x, nr.y); c.lineTo(nl.x, nl.y);
    c.closePath(); c.fill();
    c.restore();

    // 白线
    c.save();
    c.strokeStyle = 'rgba(226, 255, 248, .78)';
    c.lineWidth = Math.max(1, V.W * 0.0035);
    c.beginPath();
    c.moveTo(fl.x, fl.y); c.lineTo(fr.x, fr.y);
    c.lineTo(nr.x, nr.y); c.lineTo(nl.x, nl.y); c.closePath();
    c.stroke();
    // 中线
    const t0 = proj(0, 0), t1 = proj(0, 1);
    c.globalAlpha = 0.45;
    c.beginPath(); c.moveTo(t0.x, t0.y); c.lineTo(t1.x, t1.y); c.stroke();
    c.restore();

    // 台面文字
    c.save();
    c.globalAlpha = 0.1;
    c.fillStyle = '#d8fff7';
    c.textAlign = 'center';
    c.font = `800 ${Math.max(12, V.W * 0.07)}px system-ui, sans-serif`;
    c.fillText('ARC', g.cx, proj(0, 0.74).y);
    c.restore();
  }

  function drawNet() {
    const c = V.ctx;
    const NH = 0.1525;
    const top = [], bot = [];
    const N = 20;
    for (let i = 0; i <= N; i++) {
      const x = -1 + (2 * i) / N;
      top.push(proj(x, 0.5, NH));
      bot.push(proj(x, 0.5, 0));
    }
    c.save();
    // 网面
    c.beginPath();
    c.moveTo(top[0].x, top[0].y);
    for (let i = 1; i <= N; i++) c.lineTo(top[i].x, top[i].y);
    for (let i = N; i >= 0; i--) c.lineTo(bot[i].x, bot[i].y);
    c.closePath();
    c.fillStyle = 'rgba(205, 235, 255, .17)';
    c.fill();

    // 网格
    c.strokeStyle = 'rgba(215, 240, 255, .24)';
    c.lineWidth = 0.7;
    for (let i = 0; i <= N; i += 2) {
      c.beginPath(); c.moveTo(top[i].x, top[i].y); c.lineTo(bot[i].x, bot[i].y); c.stroke();
    }
    for (let k = 1; k <= 3; k++) {
      const z = (NH * k) / 4;
      c.beginPath();
      for (let i = 0; i <= N; i++) {
        const p = proj(-1 + (2 * i) / N, 0.5, z);
        if (i === 0) c.moveTo(p.x, p.y); else c.lineTo(p.x, p.y);
      }
      c.stroke();
    }

    // 上沿白边
    c.strokeStyle = 'rgba(240, 252, 255, .9)';
    c.lineWidth = Math.max(1.4, V.W * 0.004);
    c.beginPath();
    for (let i = 0; i <= N; i++) {
      if (i === 0) c.moveTo(top[i].x, top[i].y); else c.lineTo(top[i].x, top[i].y);
    }
    c.stroke();

    // 网柱
    c.strokeStyle = 'rgba(225, 245, 255, .8)';
    c.lineWidth = Math.max(2, V.W * 0.006);
    c.beginPath();
    const pl = proj(-1.01, 0.5, 0), plt = proj(-1.01, 0.5, NH);
    c.moveTo(pl.x, pl.y); c.lineTo(plt.x, plt.y);
    const pr = proj(1.01, 0.5, 0), prt = proj(1.01, 0.5, NH);
    c.moveTo(pr.x, pr.y); c.lineTo(prt.x, prt.y);
    c.stroke();
    c.restore();
  }

  function drawPlayer(side, t) {
    const c = V.ctx;
    const p = V.players[side];
    const a = anchor(side, p.x);
    const near = a.near;
    const h = a.h;
    const bob = Math.sin(t * 2.2 + (near ? 0 : 1.4)) * h * 0.012;
    const feetY = a.feetY + bob;
    const hipY = feetY - h * 0.42;
    const shoulderY = feetY - h * 0.76;
    const headR = h * 0.088;
    const headY = feetY - h * 0.865;

    const jersey = near ? '#1cc3aa' : '#f45c6e';
    const jerseyDark = near ? '#0d8d7c' : '#b53b4c';
    const skin = near ? '#f0c7a4' : '#dba57d';
    const hair = near ? '#141b22' : '#1b1414';
    const shorts = '#0d1826';

    c.save();
    // 影子
    c.fillStyle = 'rgba(0,0,0,.35)';
    c.beginPath();
    c.ellipse(a.x, feetY + h * 0.02, h * 0.23, h * 0.05, 0, 0, Math.PI * 2);
    c.fill();

    // 腿
    c.strokeStyle = '#0a121d';
    c.lineWidth = Math.max(4, h * 0.075);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(a.x - h * 0.075, hipY);
    c.lineTo(a.x - h * 0.14, feetY);
    c.moveTo(a.x + h * 0.075, hipY);
    c.lineTo(a.x + h * 0.14, feetY);
    c.stroke();

    // 鞋
    c.strokeStyle = '#dcecff';
    c.lineWidth = Math.max(2, h * 0.022);
    c.beginPath();
    c.moveTo(a.x - h * 0.19, feetY + h * 0.006);
    c.lineTo(a.x - h * 0.10, feetY + h * 0.006);
    c.moveTo(a.x + h * 0.10, feetY + h * 0.006);
    c.lineTo(a.x + h * 0.19, feetY + h * 0.006);
    c.stroke();

    // 短裤
    c.fillStyle = shorts;
    roundRect(c, a.x - h * 0.12, hipY - h * 0.06, h * 0.24, h * 0.17, h * 0.04);
    c.fill();

    // 躯干
    const tw = h * 0.28, th = h * 0.30;
    const jerseyGrad = c.createLinearGradient(a.x - tw / 2, shoulderY, a.x + tw / 2, shoulderY + th);
    jerseyGrad.addColorStop(0, jersey);
    jerseyGrad.addColorStop(1, jerseyDark);
    c.fillStyle = jerseyGrad;
    roundRect(c, a.x - tw / 2, shoulderY, tw, th, h * 0.055);
    c.fill();

    // 背号
    c.fillStyle = near ? 'rgba(4, 30, 27, .55)' : 'rgba(60, 8, 16, .5)';
    c.font = `800 ${h * 0.13}px system-ui, sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(near ? '7' : '1', a.x, shoulderY + th * 0.48);

    // 手臂与球拍
    const swing = Math.sin(clamp(p.swing, 0, 1) * Math.PI);
    const isRight = true;
    const dir = isRight ? 1 : -1;
    const shX = a.x + dir * tw * 0.45;
    const handBaseX = a.x + dir * (tw * 0.62 + h * 0.05);
    const handBaseY = shoulderY + th * 0.52;
    const handX = handBaseX + dir * swing * h * 0.16;
    const handY = handBaseY - swing * h * 0.20 + (near ? 0 : h * 0.03);

    // 非持拍手
    c.strokeStyle = skin;
    c.lineWidth = Math.max(2.5, h * 0.045);
    c.beginPath();
    c.moveTo(a.x - dir * tw * 0.45, shoulderY + h * 0.05);
    c.lineTo(a.x - dir * (tw * 0.62 + h * 0.03), shoulderY + th * 0.62);
    c.stroke();

    // 持拍手
    c.beginPath();
    c.moveTo(shX, shoulderY + h * 0.05);
    c.lineTo(handX, handY);
    c.stroke();

    // 球拍
    const pr = h * 0.078;
    c.save();
    c.translate(handX, handY);
    c.rotate((-0.5 + swing * 0.9) * dir);
    // 拍柄
    c.fillStyle = '#3a2416';
    roundRect(c, -pr * 0.15, pr * 0.52, pr * 0.3, pr * 1.05, 1.4);
    c.fill();
    // 拍面
    c.fillStyle = near ? '#d33c50' : '#303b4d';
    c.beginPath();
    c.arc(0, 0, pr, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = 'rgba(8, 12, 18, .85)';
    c.lineWidth = Math.max(1, pr * 0.18);
    c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.3)';
    c.lineWidth = 0.8;
    c.beginPath();
    c.arc(-pr * 0.15, -pr * 0.15, pr * 0.55, Math.PI, Math.PI * 1.6);
    c.stroke();
    c.restore();

    // 头
    c.fillStyle = skin;
    c.beginPath();
    c.arc(a.x, headY, headR, 0, Math.PI * 2);
    c.fill();

    // 头发
    c.fillStyle = hair;
    c.beginPath();
    c.arc(a.x, headY - headR * 0.22, headR * 0.98, Math.PI * 1.02, Math.PI * 1.98);
    c.fill();
    if (!near) {
      // 面部
      c.fillStyle = 'rgba(20, 15, 12, .7)';
      c.beginPath(); c.arc(a.x - headR * 0.32, headY + headR * 0.1, headR * 0.1, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(a.x + headR * 0.32, headY + headR * 0.1, headR * 0.1, 0, Math.PI * 2); c.fill();
    }

    c.restore();
  }

  function drawBallAndTrail() {
    const c = V.ctx;
    const a = V.anim;
    if (!a) return;
    const ball = ballAt(a.elapsed);
    if (!ball || a.elapsed > a.total + 0.1) return;

    // 影子
    if (ball.worldY >= -0.1 && ball.worldY <= 1.1 && Math.abs(ball.worldX) <= 1.1) {
      const sh = proj(ball.worldX, ball.worldY, 0);
      const k = clamp(1 - ball.z * 1.6, 0.2, 1);
      c.save();
      c.globalAlpha = 0.28 * k;
      c.fillStyle = '#000';
      c.beginPath();
      c.ellipse(sh.x, sh.y, ball.r * 1.15 * k, ball.r * 0.5 * k, 0, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    // 拖尾（一条渐隐的弧线 + 少量光点）
    c.save();
    if (V.trail.length > 2) {
      c.strokeStyle = 'rgba(255, 209, 92, .22)';
      c.lineWidth = 2;
      c.lineCap = 'round';
      c.beginPath();
      for (let i = 0; i < V.trail.length; i++) {
        const tr = V.trail[i];
        if (i === 0) c.moveTo(tr.x, tr.y); else c.lineTo(tr.x, tr.y);
      }
      c.stroke();
    }
    for (let i = 0; i < V.trail.length; i += 2) {
      const tr = V.trail[i];
      const alpha = (tr.life / tr.max) * 0.22 * ((i + 1) / V.trail.length);
      c.globalAlpha = alpha;
      c.fillStyle = '#ffd15c';
      c.beginPath();
      c.arc(tr.x, tr.y, tr.r * 0.45, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();

    // 球
    c.save();
    const grd = c.createRadialGradient(ball.x - ball.r * 0.35, ball.y - ball.r * 0.35, ball.r * 0.1, ball.x, ball.y, ball.r * 1.1);
    grd.addColorStop(0, '#fff9dd');
    grd.addColorStop(0.55, '#ffd15c');
    grd.addColorStop(1, '#e09a19');
    c.fillStyle = grd;
    c.beginPath();
    c.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = 'rgba(120, 70, 0, .28)';
    c.lineWidth = 0.7;
    c.stroke();
    c.restore();
  }

  function drawParticles() {
    const c = V.ctx;
    c.save();
    for (const p of V.particles) {
      const alpha = clamp(p.life / (p.max || 0.6), 0, 1);
      if (p.confetti) {
        c.globalAlpha = alpha;
        c.fillStyle = p.c;
        c.fillRect(p.x, p.y, p.r * 2, p.r * 1.2);
      } else {
        c.globalAlpha = alpha * 0.45;
        c.fillStyle = p.c + alpha + ')';
        c.beginPath();
        c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        c.fill();
      }
    }
    c.restore();
  }

  window.Court = {
    init: initCanvas,
    start,
    stop,
    resize,
    playPoint,
    setSpeed: (s) => { V.speed = s; },
    celebrate,
    resetPlayers: () => {
      V.players.A = { x: 0, tx: 0, swing: 0 };
      V.players.B = { x: 0, tx: 0, swing: 0 };
      V.trail = [];
    }
  };
})();

</script>
<script>
/* 弧光乒乓 · 界面与流程 */
(function () {
  'use strict';

  const TT = window.TT;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clamp = TT.clamp;
  const fmt = (n) => Math.round(n).toLocaleString('zh-CN');
  const SAVE_KEY = 'arc-tt-save-v1';
  const SETTINGS_KEY = 'arc-tt-settings-v1';

  /* ---------------- 音效 ---------------- */
  const Sound = {
    enabled: true, ctx: null,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { this.ctx = new AC(); } catch (e) { return; }
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    },
    tone(freq, dur, type, vol, delay) {
      if (!this.enabled || !this.ctx) return;
      const t0 = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    },
    hit(kind) {
      const f = kind === 'smash' ? 1180 : kind === 'serve' ? 820 : kind === 'chop' ? 520 : 940;
      this.tone(f, 0.045, 'triangle', 0.045);
      this.tone(f * 0.5, 0.03, 'square', 0.018);
    },
    bounce() { this.tone(260, 0.05, 'sine', 0.04); },
    point(win) {
      if (win) { this.tone(660, 0.09, 'triangle', 0.05); this.tone(880, 0.12, 'triangle', 0.04, 0.07); }
      else { this.tone(300, 0.1, 'sine', 0.04); this.tone(220, 0.14, 'sine', 0.035, 0.07); }
    },
    game() { this.tone(523, 0.1, 'triangle', 0.05); this.tone(784, 0.16, 'triangle', 0.045, 0.09); },
    win() {
      [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.05, i * 0.11));
    },
    lose() {
      [392, 330, 262].forEach((f, i) => this.tone(f, 0.24, 'sine', 0.045, i * 0.13));
    }
  };

  window.Sound = Sound;

  /* ---------------- 状态 ---------------- */
  const App = {
    state: null, view: 'hub', pending: {}, openPlayer: null,
    pre: { playerId: null, tactic: null, opponent: null },
    match: null, meta: null, phase: 'idle', speed: 1,
    abort: false, resultShown: false, gameOverResolve: null,
    toastTimer: null, lastWeekly: null, resultData: null
  };

  /* ---------------- 存储 ---------------- */
  function save() {
    if (!App.state) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(App.state)); } catch (e) { /* ignore */ }
  }
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.v !== 1 || !Array.isArray(s.players)) return null;
      s.results = Array.isArray(s.results) ? s.results : [];
      s.facilities = s.facilities || { gym: 1, physio: 1, data: 1 };
      s.maxWeek = s.maxWeek || 8;
      s.seed = s.seed || 20261122;
      return s;
    } catch (e) { return null; }
  }
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      if (typeof s.sound === 'boolean') Sound.enabled = s.sound;
    } catch (e) { /* ignore */ }
  }
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ sound: Sound.enabled })); } catch (e) { /* ignore */ }
  }

  function startFromSave(s) {
    App.state = s;
    if (App.state.pendingWeek) {
      TT.advanceWeek(App.state, Math.random);
      App.state.pendingWeek = false;
      save();
    }
    App.view = 'hub';
    App.pending = {};
    if (App.state.seasonOver) {
      showMain();
      showSeason();
    } else {
      showMain();
      setView('hub');
    }
  }

  function startNew() {
    App.state = TT.newGame();
    App.view = 'hub';
    App.pending = {};
    App.openPlayer = null;
    App.pre = { playerId: null, tactic: null, opponent: null };
    save();
    showMain();
    setView('hub');
    setTimeout(() => {
      openModal(`
        <h3>欢迎来到弧光俱乐部</h3>
        <div class="m-sub">你接手了一支只有四名球员的小俱乐部。</div>
        <ul class="help-list">
          <li>每周先安排<b>训练</b>，再准备周末的比赛。体能低的球员容易失误、受伤。</li>
          <li>比赛是 11 分制，三局两胜；第 8 周决赛为五局三胜。</li>
          <li>临场使用<b>抢攻 / 稳守 / 暂停 / 爆发</b>改变走势。</li>
          <li>奖金可以升级训练中心、康复中心和数据球探。</li>
        </ul>
        <button class="btn btn-primary" data-action="close-modal">开始经营</button>
      `);
    }, 180);
  }

  /* ---------------- 界面切换 ---------------- */
  function showScreen(name) {
    $('#titleScreen').classList.toggle('hidden', name !== 'title');
    $('#mainScreen').classList.toggle('hidden', name !== 'main');
    $('#prematchScreen').classList.toggle('hidden', name !== 'prematch');
    $('#matchScreen').classList.toggle('hidden', name !== 'match');
    $('#seasonScreen').classList.toggle('hidden', name !== 'season');
  }
  function showMain() { showScreen('main'); renderTop(); }
  function setView(v) {
    if (App.state && App.state.seasonOver && v !== 'hub') {
      toast('赛季已经结束，先查看总结或开启新赛季');
      v = 'hub';
    }
    App.view = v;
    render();
    const view = $('#view');
    if (view) view.scrollTop = 0;
  }

  function renderTop() {
    const s = App.state;
    if (!s) return;
    $('#topClub').textContent = s.clubName;
    const weekText = s.seasonOver
      ? `第 ${s.season} 赛季 · 赛季结束`
      : `第 ${s.season} 赛季 · 第 ${s.week}/${s.maxWeek} 周`;
    $('#topWeek').textContent = weekText;
    $('#topMoney').textContent = '¥' + fmt(s.money);
    $('#topRep').textContent = `声望 ${s.rep}`;
    $('#soundBtn').textContent = Sound.enabled ? '🔊' : '🔇';
  }

  function render() {
    if (!App.state) return;
    renderTop();
    $$('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === App.view));
    const view = $('#view');
    if (!view) return;
    if (App.view === 'hub') view.innerHTML = renderHub();
    else if (App.view === 'train') view.innerHTML = renderTrain();
    else if (App.view === 'facility') view.innerHTML = renderFacility();
    else if (App.view === 'schedule') view.innerHTML = renderSchedule();
  }

  function renderKeepScroll(fn) {
    const view = $('#view');
    const top = view ? view.scrollTop : 0;
    fn();
    if (view) view.scrollTop = top;
  }

  /* ---------------- 通用片段 ---------------- */
  const AV_CLASS = ['', 'b', 'c', 'd'];
  function avatar(p, i) {
    return `<div class="player-avatar ${AV_CLASS[i % 4] || ''}">${p.name.slice(-1)}</div>`;
  }
  function staminaBar(v, cls) {
    const lvl = v < 20 ? 'crit' : v < 40 ? 'low' : '';
    return `<div class="bar hp ${lvl} ${cls || ''}"><i style="width:${clamp(v, 0, 100)}%"></i></div>`;
  }
  function styleChip(p) { return `<span class="chip">${TT.STYLE_LABEL[p.style] || p.style}</span>`; }
  function formArrow(f) { return f > 1.01 ? '状态 ↗' : f < 0.99 ? '状态 ↘' : '状态 →'; }
  function injuryChip(p) { return p.injury > 0 ? `<span class="chip red">伤病 ${p.injury} 周</span>` : ''; }
  function formatText(week) { return week === 8 ? '五局三胜' : '三局两胜'; }
  function formatLabel(n) { return n === 5 ? '五局三胜' : '三局两胜'; }

  function bestPlayer() {
    const fit = App.state.players.filter((p) => p.injury === 0);
    const pool = fit.length ? fit : App.state.players;
    return pool.slice().sort((a, b) =>
      (TT.overall(b) * 0.65 + b.stamina * 0.35) - (TT.overall(a) * 0.65 + a.stamina * 0.35)
    )[0];
  }

  /* ---------------- 俱乐部首页 ---------------- */
  function renderHub() {
    const s = App.state;
    if (s.seasonOver) {
      return `
        <div class="hero">
          <div class="hero-top"><span class="hero-tag">SEASON COMPLETE</span><span class="hero-week">第 ${s.season} 赛季</span></div>
          <div style="margin-top:14px"><h3 style="margin:0;font-size:24px">赛季已经结束</h3>
          <p class="muted" style="font-size:12px;line-height:1.7">查看赛季总结，或者开启下一个赛季继续带队。</p></div>
          <div class="hero-actions"><button class="btn btn-primary" data-action="season-summary">查看总结</button></div>
        </div>
        ${rosterBlock(s)}
      `;
    }
    const opp = TT.getOpponent(s, s.week);
    const lv = TT.facilityLevel(s, 'data');
    const fmtText = formatText(s.week);
    const weekLabel = s.week === 8 ? '总决赛' : `第 ${s.week} 站`;
    const noTrain = !s.weekTrained;
    return `
      <div class="hero">
        <div class="hero-top">
          <span class="hero-tag">${opp.tag}</span>
          <span class="hero-week">${weekLabel} · ${fmtText}</span>
        </div>
        <div class="hero-main">
          <div class="hero-ovr"><b>${TT.overall(opp)}</b><small>OVR</small></div>
          <div class="hero-opp">
            <h3>${opp.name}</h3>
            <p>${opp.club} · ${opp.nat} · ${opp.age} 岁</p>
            <div class="flags">
              ${lv >= 2 ? `<span class="chip on">${TT.STYLE_LABEL[opp.style]}</span>` : `<span class="chip">打法未知</span>`}
              <span class="chip">${fmtText}</span>
              ${noTrain ? `<span class="chip gold">本周尚未训练</span>` : `<span class="chip on">训练完成</span>`}
            </div>
          </div>
        </div>
        <div class="hero-actions">
          <button class="btn btn-primary" data-action="prepare">赛前准备</button>
          <button class="btn btn-ghost" data-action="tab" data-tab="train">${s.weekTrained ? '查看训练' : '安排训练'}</button>
        </div>
      </div>

      <div class="quickstats">
        <div class="qstat"><small>赛季战绩</small><b>${s.wins} 胜 ${s.losses} 负</b></div>
        <div class="qstat"><small>俱乐部声望</small><b>${s.rep}</b></div>
        <div class="qstat"><small>可用资金</small><b>¥${fmt(s.money)}</b></div>
      </div>

      ${rosterBlock(s)}

      <div class="section-head"><h2>教练笔记</h2></div>
      <div class="card" style="padding:14px;font-size:12px;line-height:1.75;color:#b9cce6">
        ${s.week === 1 ? '第一站是热身赛，先让队员找找手感。赛前记得安排训练。' :
          s.week <= 4 ? '前四站是积分赛，稳扎稳打。体能不足时，换一名生力军出场。' :
          s.week <= 6 ? '对手开始变强，善用战术克制和教练指令，别让他们把节奏带走。' :
          s.week === 7 ? '大满贯赛，世界排名第 4 的王楚钦。削球手或许能打乱他的连续弧圈。' :
          '决赛，五局三胜。面对世界第一，把暂停和爆发留到最关键的分。'}
        <br><span class="muted">提示：${['快攻','削球','弧圈','控制','搏杀'][0]}系球员安排对应主项训练成长更快。</span>
      </div>
    `;
  }

  function rosterBlock(s) {
    return `
      <div class="section-head"><h2>阵容</h2><small>${s.players.length} 名球员 · 每周每人一次训练</small></div>
      <div class="roster">
        ${s.players.map((p, i) => `
          <div class="player-row">
            ${avatar(p, i)}
            <div class="player-main">
              <div class="player-name">
                <b>${p.name}</b>${styleChip(p)}${injuryChip(p)}
              </div>
              <div class="player-sub">
                <span>${p.age} 岁 · 潜力 ${p.potential}</span><span>士气 ${Math.round(p.morale)}</span><span>${formArrow(p.form)}</span>
              </div>
              <div class="stamina-line">
                ${staminaBar(p.stamina)}
                <span>${Math.round(p.stamina)}</span>
              </div>
            </div>
            <div class="ovr-badge"><b>${TT.overall(p)}</b><small>OVR</small></div>
          </div>
        `).join('')}
      </div>
    `;
  }

  /* ---------------- 训练 ---------------- */
  function renderTrain() {
    const s = App.state;
    const block = s.weekTrained
      ? `<div class="train-intro"><span>✅</span><div><b>本周训练已完成。</b><br>前往赛前准备，或先升级设施。</div></div>`
      : `<div class="train-intro"><span>🏓</span><div><b>每名球员安排一个项目。</b><br>训练消耗体能；体能低于 35 时收益下降，低于 10 有受伤风险。</div></div>`;

    return `
      ${block}
      <div class="section-head"><h2>本周安排</h2>${s.weekTrained ? '' : '<button class="btn btn-sm" data-action="auto-train">按打法自动安排</button>'}</div>
      ${s.players.map((p, i) => {
        const open = App.openPlayer === p.id;
        const picked = App.pending[p.id];
        const prog = picked ? TT.PROGRAMS[picked] : null;
        return `
          <div class="card train-card ${open ? 'open' : ''}">
            <div class="train-head" data-action="toggle-player" data-pid="${p.id}">
              ${avatar(p, i)}
              <div class="player-main">
                <div class="player-name"><b>${p.name}</b>${styleChip(p)}${injuryChip(p)}</div>
                <div class="player-sub">
                  <span>${prog ? `已选：${prog.name}` : '未安排（默认休息）'}</span>
                  <span>体能 ${Math.round(p.stamina)}</span>
                </div>
              </div>
              <div class="ovr-badge"><b>${TT.overall(p)}</b><small>OVR</small></div>
              <span class="chev">›</span>
            </div>
            ${open ? `
              <div class="train-detail">
                <div class="program-grid">
                  ${Object.values(TT.PROGRAMS).map((pr) => programButton(p, pr, picked)).join('')}
                </div>
              </div>` : ''}
          </div>
        `;
      }).join('')}
      ${s.weekTrained
        ? `<div class="training-actions"><button class="btn btn-primary btn-block" data-action="prepare">前往赛前准备</button></div>`
        : `<div class="training-actions">
            <button class="btn btn-primary btn-block" data-action="apply-training">确认本周训练</button>
            <div class="tiny muted" style="text-align:center;margin-top:7px">未安排的球员将自动休息</div>
          </div>`}
      <div style="height:10px"></div>
    `;
  }

  function programButton(p, pr, picked) {
    const sel = picked === pr.key;
    const disabled = p.injury > 0 || App.state.weekTrained;
    let cost = '';
    if (pr.rest) {
      cost = `<span>体能 +${pr.stamina}</span><span>士气 +${pr.morale}</span>`;
    } else {
      cost = `<span class="neg">体能 ${pr.stamina}</span><span>+${TT.STAT_LABEL[pr.stat]}</span>`;
    }
    return `
      <button class="program ${sel ? 'selected' : ''}" data-action="pick-program" data-pid="${p.id}" data-program="${pr.key}" ${disabled ? 'disabled' : ''}>
        <b>${pr.name}<em>${pr.rest ? '恢复' : '主项'}</em></b>
        <small>${pr.desc}</small>
        <div class="cost">${cost}</div>
      </button>
    `;
  }

  function applyTraining() {
    const s = App.state;
    if (!s || s.weekTrained) return;
    const lines = [];
    for (const p of s.players) {
      const key = App.pending[p.id] || 'rest';
      const r = TT.trainPlayer(s, p.id, key, Math.random);
      if (!r.ok) { lines.push(`${p.name}：${r.msg}`); continue; }
      if (r.rest) {
        lines.push(`${p.name}：休息调整，体能 +${TT.PROGRAMS.rest.stamina}`);
      } else if (r.gains && r.gains.length) {
        const g = r.gains[0];
        lines.push(`${p.name}：${r.program}，${g.label} +${g.n}${r.injury ? '（受伤）' : ''}`);
      } else {
        lines.push(`${p.name}：${r.program}，完成训练${r.tired ? '（疲劳，收益下降）' : ''}`);
      }
      if (r.injury) lines.push(`⚠ ${p.name} 训练中受伤，将缺席 1-2 周`);
    }
    s.weekTrained = true;
    App.pending = {};
    App.openPlayer = null;
    save();
    render();
    openModal(`
      <h3>本周训练完成</h3>
      <div class="m-sub">状态会保留到比赛结束</div>
      ${lines.map((l) => `<div class="report-line"><span>${l}</span></div>`).join('')}
      <button class="btn btn-primary" data-action="prepare">前往赛前准备</button>
      <button class="btn btn-ghost" data-action="close-modal">留在这里</button>
    `);
  }

  /* ---------------- 设施 ---------------- */
  function renderFacility() {
    const s = App.state;
    return `
      <div class="train-intro"><span>🏗️</span><div><b>设施决定训练上限。</b><br>资金来自赞助、奖金和声望。升级会立即生效。</div></div>
      <div class="tiny muted" style="margin:0 2px 10px">当前资金 <b style="color:var(--orange)">¥${fmt(s.money)}</b></div>
      ${Object.values(TT.FACILITIES).map((f) => {
        const lv = TT.facilityLevel(s, f.key);
        const max = lv >= f.max;
        const cost = max ? 0 : f.costs[lv];
        const can = !max && s.money >= cost;
        return `
          <div class="card facility">
            <div class="facility-head">
              <div class="facility-icon">${f.icon}</div>
              <div class="facility-title">
                <b>${f.name}</b>
                <small>${f.effect(lv)}${max ? '' : `　→　${f.effect(lv + 1)}`}</small>
                <div class="level-pips">${[1, 2, 3].map((n) => `<i class="${n <= lv ? 'on' : ''}"></i>`).join('')}</div>
              </div>
            </div>
            <div class="facility-foot">
              <div class="price">${max ? '<span class="chip on">已满级</span>' : `升级费用 <b>¥${fmt(cost)}</b>`}</div>
              <button class="btn btn-sm ${can ? 'btn-warn' : ''}" data-action="upgrade" data-key="${f.key}" ${can ? '' : 'disabled'}>
                ${max ? '满级' : `升级 Lv.${lv + 1}`}
              </button>
            </div>
          </div>
        `;
      }).join('')}
      <div class="tiny muted" style="text-align:center;margin-top:10px">训练中心影响成长，康复中心影响每周恢复，数据球探影响赛前情报。</div>
    `;
  }

  /* ---------------- 赛程 ---------------- */
  function renderSchedule() {
    const s = App.state;
    const rows = [];
    for (let w = 1; w <= s.maxWeek; w++) {
      const opp = TT.getOpponent(s, w);
      const res = s.results.find((r) => r.week === w);
      let cls = '', right = '', sub = '';
      if (res) {
        cls = `done ${res.win ? 'win' : 'loss'}`;
        right = `<b>${res.win ? '胜' : '负'}</b><small>${res.score}</small>`;
        sub = res.win ? '已结束' : '已结束';
      } else if (w === s.week && !s.seasonOver) {
        cls = 'now';
        right = `<span class="chip gold">本轮</span>`;
        sub = '待赛';
      } else {
        cls = 'locked';
        right = `<span class="chip">待赛</span>`;
        sub = '未开始';
      }
      rows.push(`
        <div class="round ${cls}">
          <div class="week-no">W${w}</div>
          <div class="r-main">
            <b>${opp.name}</b>
            <small>${opp.tag} · ${formatText(w)} · ${sub}</small>
          </div>
          <div class="r-res">${right}</div>
        </div>
      `);
    }
    return `
      <div class="train-intro"><span>📅</span><div><b>八周赛季，一站比一站强。</b><br>第 8 周为五局三胜的总决赛。赛季胜场决定评级。</div></div>
      ${rows.join('')}
      <div class="tiny muted" style="text-align:center;margin-top:8px">对手数据参考 ITTF 2026 年第 46 周世界排名，数值经游戏平衡压缩。</div>
    `;
  }

  /* ---------------- 赛前 ---------------- */
  function enterPrematch() {
    const s = App.state;
    if (!s || s.seasonOver) return;
    const fit = s.players.filter((x) => x.injury === 0);
    if (!fit.length) {
      openModal(`
        <h3>无人可以出场</h3>
        <p class="muted" style="font-size:12px">四名球员都在伤病恢复中。本周只能弃权，让队员安心养伤。</p>
        <button class="btn btn-warn" data-action="skip-week">本周弃权</button>
        <button class="btn btn-ghost" data-action="close-modal">再等等</button>
      `);
      return;
    }
    const opp = TT.getOpponent(s, s.week);
    App.pre.opponent = opp;
    let p = s.players.find((x) => x.id === App.pre.playerId);
    if (!p || p.injury > 0) p = bestPlayer();
    App.pre.playerId = p.id;
    if (!App.pre.tactic) App.pre.tactic = p.style;
    App.pre.format = s.week === 8 ? 5 : 3;
    renderPrematch();
    showScreen('prematch');
  }

  function renderPrematch() {
    const s = App.state;
    const opp = App.pre.opponent;
    if (!opp) return;
    const dataLv = TT.facilityLevel(s, 'data');
    const p = s.players.find((x) => x.id === App.pre.playerId) || bestPlayer();
    const weakKey = TT.STAT_KEYS.slice().sort((a, b) => opp.stats[a] - opp.stats[b])[0];
    const fmtText = formatText(s.week);
    $('#preFormat').textContent = fmtText;

    const body = $('#prematchBody');
    body.innerHTML = `
      <div class="opp-banner">
        <div class="opp-ovr"><b>${TT.overall(opp)}</b><small>OPPONENT OVR</small></div>
        <div class="opp-info">
          <h3>${opp.name}</h3>
          <p>${opp.club} · ${opp.nat} · ${opp.age} 岁</p>
          <div class="flags" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">
            ${dataLv >= 2 ? `<span class="chip on">${TT.STYLE_LABEL[opp.style]}</span>` : `<span class="chip">打法未知</span>`}
            <span class="chip">${opp.tag}</span>
          </div>
        </div>
      </div>

      <div class="scout">
        ${dataLv >= 3 ? `
          <b>球探报告 · 弱点：${TT.STAT_LABEL[weakKey]} ${opp.stats[weakKey]}</b><br>
          针对该弱点进攻，本场攻击 <span class="weak">+3</span>。
          <div class="scout-stats">
            ${TT.STAT_KEYS.map((k) => `<div class="scout-stat">${TT.STAT_LABEL[k]}<b>${opp.stats[k]}</b></div>`).join('')}
          </div>
        ` : dataLv >= 2 ? `
          <b>球探报告：</b>对手是 <span class="weak">${TT.STYLE_LABEL[opp.style]}</span> 型打法。${TT.STYLE_DESC[opp.style]}<br>
          <span class="muted">升级数据球探到 Lv.3 可查看具体弱点。</span>
        ` : `
          <b>球探报告：</b>数据球探等级不足，只能确认对手总评 <span class="weak">${TT.overall(opp)}</span>。<br>
          <span class="muted">升级“数据球探”可查看打法，Lv.3 可查看弱点并获得攻击加成。</span>
        `}
      </div>

      <div class="section-head"><h2>出场球员</h2><small>体能影响移动和失误率</small></div>
      <div class="lineup">
        ${s.players.map((pl, i) => {
          const sel = pl.id === p.id;
          return `
            <button class="pick ${sel ? 'sel' : ''} ${pl.injury > 0 ? 'injured' : ''}" data-action="pick-player" data-pid="${pl.id}" ${pl.injury > 0 ? 'disabled' : ''}>
              <div class="pk-top"><b>${pl.name}</b><span>${TT.overall(pl)}</span></div>
              <div class="pk-sub">${TT.STYLE_LABEL[pl.style]} · ${pl.injury > 0 ? `伤病 ${pl.injury} 周` : `体能 ${Math.round(pl.stamina)}`}</div>
              ${staminaBar(pl.stamina)}
            </button>
          `;
        }).join('')}
      </div>

      <div class="section-head"><h2>比赛战术</h2><small>克制：快攻→削球→弧圈→控制→快攻</small></div>
      <div class="tactics">
        ${Object.values(TT.TACTICS).map((t) => {
          const key = Object.keys(TT.TACTICS).find((k) => TT.TACTICS[k] === t);
          const sel2 = App.pre.tactic === key;
          const counter = dataLv >= 2 && beats(key, opp.style);
          return `
            <button class="tactic ${sel2 ? 'sel' : ''}" data-action="pick-tactic" data-tactic="${key}">
              <div class="t-top"><b>${t.name}</b>${counter ? '<span class="counter">克制对手</span>' : ''}</div>
              <small>${t.desc}</small>
            </button>
          `;
        }).join('')}
      </div>

      <div class="card" style="margin-top:14px;padding:13px;font-size:11px;line-height:1.7;color:#a9c0dd">
        <b style="color:var(--text)">临场指令</b><br>
        抢攻 / 稳守：4 分增益，冷却 5 分；暂停：每局 1 次；气势满 100 可发动爆发。
        ${p.stamina < 30 ? `<br><span style="color:var(--orange)">警告：${p.name} 体能偏低，后程可能掉速。</span>` : ''}
        ${!s.weekTrained ? `<br><span style="color:var(--orange)">本周尚未训练，可以直接比赛，但会错过成长。</span>` : ''}
      </div>
      <div style="height:8px"></div>
    `;

    const btn = $('#startMatchBtn');
    btn.disabled = p.injury > 0;
    btn.textContent = p.injury > 0 ? '该球员无法出场' : `与 ${opp.name} 开赛`;
  }

  function beats(a, b) {
    const map = { fast: 'chop', chop: 'loop', loop: 'control', control: 'fast' };
    return map[a] === b;
  }

  /* ---------------- 比赛 ---------------- */
  function startMatch() {
    const s = App.state;
    const p = s.players.find((x) => x.id === App.pre.playerId);
    const opp = App.pre.opponent;
    if (!p || !opp || p.injury > 0) return;
    const format = s.week === 8 ? 5 : 3;
    const scoutBonus = TT.facilityLevel(s, 'data') >= 3 ? 3 : 0;
    const tactic = App.pre.tactic || p.style;
    App.match = TT.createMatch(p, opp, format, { tactic, scoutBonus });
    App.meta = { playerId: p.id, opponent: opp, format };
    App.speed = 1;
    App.abort = false;
    App.resultShown = false;
    App.resultData = null;
    App.phase = 'anim';
    $('#speedBtn').textContent = '1×';
    $('#matchResult').classList.add('hidden');
    $('#gameOverlay').classList.add('hidden');
    $('#matchToast').classList.remove('show');
    showScreen('match');
    updateMatchHUD();
    requestAnimationFrame(() => {
      Court.init($('#court'), App.match);
      Court.setSpeed(App.speed);
      runMatch();
    });
  }

  function updateMatchHUD() {
    const m = App.match;
    if (!m) return;
    $('#mNameA').textContent = m.A.name;
    $('#mNatA').textContent = `${m.A.nat} · ${TT.STYLE_LABEL[m.A.style]}`;
    $('#mNameB').textContent = m.B.name;
    $('#mNatB').textContent = `${m.B.nat} · ${TT.STYLE_LABEL[m.B.style]}`;
    $('#mPtsA').textContent = m.pointsA;
    $('#mPtsB').textContent = m.pointsB;
    $('#mRound').textContent = `第 ${m.game} 局 · ${formatLabel(m.format)}`;
    const need = m.format === 5 ? 3 : 2;
    let dots = '';
    for (let i = 0; i < need; i++) dots += `<span class="gd ${i < m.gamesA ? 'a' : ''}"></span>`;
    dots += `<span style="width:5px"></span>`;
    for (let i = 0; i < need; i++) dots += `<span class="gd ${i < m.gamesB ? 'b' : ''}"></span>`;
    $('#mGames').innerHTML = dots;
    if (!m.over) {
      $('#mServe').textContent = `发球：${m.server === 'A' ? m.A.name : m.B.name}`;
    } else {
      $('#mServe').textContent = m.winner === 'A' ? '比赛结束 · 胜利' : '比赛结束 · 惜败';
    }
    $('#mStamA').textContent = `体能 ${Math.round(m.A.stamina)}`;
    $('#mStamB').textContent = `体能 ${Math.round(m.B.stamina)}`;
    setBar('#mStamBarA', m.A.stamina);
    setBar('#mStamBarB', m.B.stamina);
    $('#mTacA').textContent = TT.TACTICS[m.A.tactic].name;
    $('#mTacB').textContent = TT.TACTICS[m.B.tactic].name;
    $('#mMomentum').style.width = m.A.momentum + '%';
    $('#mMomentumVal').textContent = Math.round(m.A.momentum);
    updateCoachButtons();
  }

  function setBar(sel, v) {
    const el = $(sel);
    if (!el) return;
    el.style.width = clamp(v, 0, 100) + '%';
    const bar = el.parentElement;
    bar.classList.toggle('low', v < 35);
    bar.classList.toggle('crit', v < 18);
  }

  function updateCoachButtons() {
    const m = App.match;
    if (!m) return;
    const c = m.coach;
    const attack = $('#cbAttack'), defend = $('#cbDefend'), timeout = $('#cbTimeout'), burst = $('#cbBurst');
    attack.disabled = c.cooldown > 0 || m.over;
    defend.disabled = c.cooldown > 0 || m.over;
    timeout.disabled = c.timeouts <= 0 || m.over;
    burst.disabled = m.A.momentum < 99 || m.over;
    attack.querySelector('small').textContent = c.cooldown > 0 ? `冷却 ${c.cooldown} 分` : '4 分增益';
    defend.querySelector('small').textContent = c.cooldown > 0 ? `冷却 ${c.cooldown} 分` : '4 分增益';
    timeout.querySelector('small').textContent = c.timeouts > 0 ? '每局 1 次' : '本局已用';
    burst.querySelector('small').textContent = m.A.momentum >= 99 ? '可发动' : `${Math.round(m.A.momentum)} 气势`;
    burst.classList.toggle('ready', m.A.momentum >= 99);
    attack.classList.toggle('ready', c.cooldown === 0 && !m.over);
    defend.classList.toggle('ready', c.cooldown === 0 && !m.over);
  }

  async function runMatch() {
    const m = App.match;
    if (!m) return;
    App.abort = false;
    await sleep(420);
    try {
      while (!m.over) {
        if (App.abort) return;
        App.phase = 'anim';
        const pt = TT.simulatePoint(m, Math.random);
        await Court.playPoint(pt);
        if (App.abort) return;
        const ev = TT.applyPoint(m, pt);
        updateMatchHUD();
        showPointFlash(pt);
        Sound.point(pt.winner === 'A');

        if (ev.matchOver) {
          await sleep(520);
          if (App.abort) return;
          finishMatchUI();
          return;
        }
        if (ev.gameOver) {
          updateMatchHUD();
          Sound.game();
          await showGameOver(ev);
          if (App.abort) return;
          TT.startNextGame(m);
          updateMatchHUD();
          await sleep(260);
          continue;
        }
        App.phase = 'between';
        await sleep(900);
        if (App.abort) return;
        const msg = TT.aiAdjust(m, Math.random);
        if (msg) { matchToast(msg); updateMatchHUD(); }
        App.phase = 'anim';
      }
    } catch (e) {
      console.error(e);
    }
  }

  function showPointFlash(pt) {
    const el = $('#pointFlash');
    el.classList.remove('show');
    void el.offsetWidth;
    el.textContent = pt.winner === 'A' ? pt.reason : `失分 · ${pt.reason}`;
    el.classList.toggle('bad', pt.winner !== 'A');
    el.classList.add('show');
  }

  function matchToast(msg) {
    const el = $('#matchToast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(App.toastTimer);
    App.toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function showGameOver(ev) {
    return new Promise((resolve) => {
      const m = App.match;
      App.gameOverResolve = resolve;
      $('#goTitle').textContent = `第 ${m.game} 局结束`;
      $('#goScore').textContent = `${m.pointsA} : ${m.pointsB}`;
      $('#goSub').textContent = ev.gameWinner === 'A'
        ? `${m.A.name} 拿下这一局`
        : `${m.B.name} 拿下这一局`;
      $('#gameOverlay').classList.remove('hidden');
    });
  }

  function finishMatchUI() {
    if (App.resultShown) return;
    App.resultShown = true;
    const m = App.match;
    const res = TT.finishMatch(App.state, m, App.meta.opponent);
    App.state.pendingWeek = true;
    save();
    App.resultData = res;

    const win = res.win;
    $('#matchResultCard').innerHTML = `
      <div class="kicker">${win ? 'VICTORY' : 'DEFEAT'}</div>
      <h2 style="color:${win ? 'var(--teal)' : 'var(--red)'}">${win ? '胜利' : '惜败'}</h2>
      <div class="big-score">
        <span class="${win ? 'win' : 'lose'}">${m.gamesA}</span>
        <span style="color:var(--muted);font-size:26px"> : </span>
        <span>${m.gamesB}</span>
      </div>
      <p>${win ? `击败 ${App.meta.opponent.name}，俱乐部声望 +${res.rep}` : `${App.meta.opponent.name} 赢下了这场对决`}</p>
      <div class="result-grid">
        <div class="result-cell"><small>比赛奖金</small><b>¥${fmt(res.prize)}</b></div>
        <div class="result-cell"><small>声望</small><b>+${res.rep}</b></div>
        <div class="result-cell"><small>制胜分</small><b>${m.stats.A.winners}</b></div>
        <div class="result-cell"><small>主动失误</small><b>${m.stats.A.errors}</b></div>
      </div>
      <div class="tiny muted" style="margin-top:2px">${m.A.name} 赛后体能 ${res.stamina}</div>
      <button class="btn btn-primary" data-action="match-return">返回俱乐部</button>
    `;
    $('#matchResult').classList.remove('hidden');
    Court.celebrate(win);
    if (win) Sound.win(); else Sound.lose();
  }

  function forfeitMatch() {
    closeModal();
    const m = App.match;
    if (!m || App.resultShown) return;
    App.abort = true;
    Court.stop();
    m.over = true;
    m.winner = 'B';
    m.gamesA = 0;
    m.gamesB = m.format === 5 ? 3 : 2;
    $('#gameOverlay').classList.add('hidden');
    finishMatchUI();
  }

  /* ---------------- 周结算与赛季 ---------------- */
  function returnFromMatch() {
    const s = App.state;
    $('#matchResult').classList.add('hidden');
    Court.stop();
    showMain();
    let wk = null;
    if (s.pendingWeek) {
      wk = TT.advanceWeek(s, Math.random);
      s.pendingWeek = false;
      save();
    }
    App.resultData = null;
    if (s.seasonOver) {
      showSeason();
      return;
    }
    App.view = 'hub';
    render();
    if (wk) showWeekModal(wk);
  }

  function skipWeek() {
    const s = App.state;
    closeModal();
    s.losses++;
    s.results.push({ week: s.week, name: '弃权', nat: '—', score: '0:2', win: false, points: '0:0', prize: 0, rep: 0 });
    const wk = TT.advanceWeek(s, Math.random);
    s.pendingWeek = false;
    save();
    render();
    if (s.seasonOver) showSeason();
    else showWeekModal(wk);
  }

  function showWeekModal(wk) {
    const s = App.state;
    const next = TT.getOpponent(s, s.week);
    openModal(`
      <h3>第 ${s.week - 1} 周结算</h3>
      <div class="m-sub">下一站：${next.name} · ${next.tag}</div>
      <div class="report-line"><span>赞助与门票收入</span><span style="color:var(--teal)">+¥${fmt(wk.income)}</span></div>
      <div class="report-line"><span>球员工资</span><span style="color:var(--red)">-¥${fmt(wk.wages)}</span></div>
      <div class="report-line"><span>康复中心恢复</span><span>体能 +${wk.rec}</span></div>
      <div class="report-line"><span>当前资金</span><b>¥${fmt(s.money)}</b></div>
      <button class="btn btn-primary" data-action="close-modal">进入第 ${s.week} 周</button>
    `);
  }

  function showSeason() {
    const s = App.state;
    const sum = TT.seasonSummary(s);
    const gradeColor = sum.wins >= 6 ? 'var(--teal)' : sum.wins >= 4 ? 'var(--orange)' : 'var(--red)';
    $('#seasonScreen').innerHTML = `
      <div class="trophy">${sum.champion ? '🏆' : sum.wins >= 5 ? '🥈' : '🏓'}</div>
      <div class="brand-kicker">SEASON ${s.season} COMPLETE</div>
      <h1>${sum.champion ? '世界之巅' : '赛季结束'}</h1>
      <div class="muted" style="font-size:12px">${s.clubName} · ${sum.wins} 胜 ${sum.losses} 负</div>
      <div class="grade" style="color:${gradeColor}">${sum.grade}</div>
      <div class="s-stats">
        <div class="s-stat"><small>赛季胜场</small><b>${sum.wins} / ${sum.played || s.maxWeek}</b></div>
        <div class="s-stat"><small>俱乐部声望</small><b>${sum.rep}</b></div>
        <div class="s-stat"><small>赛季 MVP</small><b>${sum.mvp}</b></div>
        <div class="s-stat"><small>剩余资金</small><b>¥${fmt(sum.money)}</b></div>
      </div>
      <p class="muted" style="font-size:12px;line-height:1.7">
        ${sum.champion ? '你带领这支小俱乐部击败了世界第一，写下了属于自己的弧光。' :
          sum.wins >= 5 ? '球队已经站稳脚跟。升级设施，下个赛季走得更远。' :
          '对手越来越强，但年轻人还有成长空间。下个赛季再来。'}
      </p>
      <button class="btn btn-primary" data-action="season-new">开启第 ${s.season + 1} 赛季</button>
      <button class="btn btn-ghost" data-action="back-hub" style="margin-top:9px">留在俱乐部</button>
      <div class="title-foot" style="margin-top:14px">新赛季对手会更强，球员也会继续成长</div>
    `;
    showScreen('season');
  }

  function newSeason() {
    const s = App.state;
    TT.newSeason(s);
    s.pendingWeek = false;
    App.view = 'hub';
    save();
    showMain();
    setView('hub');
    toast(`第 ${s.season} 赛季开始，对手更强了`, 'good');
  }

  /* ---------------- 弹窗 / Toast ---------------- */
  function openModal(html) {
    $('#modalRoot').innerHTML = `<div class="modal-back"><div class="modal">${html}</div></div>`;
  }
  function closeModal() { $('#modalRoot').innerHTML = ''; }

  function toast(msg, tone) {
    const root = $('#toastRoot');
    const el = document.createElement('div');
    el.className = 'toast' + (tone ? ' ' + tone : '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  function showHelp() {
    openModal(`
      <h3>玩法说明</h3>
      <div class="m-sub">模拟经营 + 实时球台比赛</div>
      <ol class="help-list">
        <li><b>一周一赛：</b>先给四名球员安排训练，再选择一名球员出战。体能低会影响移动和击球，低于 10 有受伤风险。</li>
        <li><b>比赛规则：</b>11 分制，领先 2 分获胜；每 2 分换发，10 平后每 1 分换发。常规站三局两胜，第 8 周决赛五局三胜。</li>
        <li><b>战术克制：</b>快攻 → 削球 → 弧圈 → 控制 → 快攻。克制方获得明显加成；搏杀风险高、收益也高。</li>
        <li><b>临场指令：</b>抢攻 / 稳守获得 4 分增益，冷却 5 分；暂停每局 1 次，恢复体能并打断对手气势；气势满 100 可发动爆发。</li>
        <li><b>经营：</b>奖金和声望带来收入，用来升级训练中心、康复中心、数据球探。数据球探 Lv.3 能看到对手弱点并 +3 攻击。</li>
      </ol>
      <div class="tiny muted">比赛数据为模拟，球员排名参考 ITTF 2026 年第 46 周榜单。</div>
      <button class="btn btn-primary" data-action="close-modal">知道了</button>
    `);
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    if (Sound.enabled) Sound.init();
    const action = el.dataset.action;

    if (action === 'new-game') {
      if (loadSave() || App.state) {
        openModal(`
          <h3>开始新的生涯？</h3>
          <p class="muted" style="font-size:12px">当前生涯的进度会被覆盖。</p>
          <button class="btn btn-warn" data-action="new-game-confirm">覆盖并开始</button>
          <button class="btn btn-ghost" data-action="close-modal">取消</button>
        `);
      } else startNew();
      return;
    }
    if (action === 'new-game-confirm') { closeModal(); startNew(); return; }
    if (action === 'continue') {
      const s = loadSave();
      if (!s) { toast('没有找到存档', 'bad'); return; }
      closeModal();
      startFromSave(s);
      return;
    }
    if (action === 'help') { showHelp(); return; }
    if (action === 'close-modal') { closeModal(); return; }
    if (action === 'toggle-sound') {
      Sound.enabled = !Sound.enabled;
      Sound.init();
      saveSettings();
      $('#soundBtn').textContent = Sound.enabled ? '🔊' : '🔇';
      toast(Sound.enabled ? '声音已开启' : '声音已关闭');
      return;
    }
    if (action === 'tab') { setView(el.dataset.tab); return; }
    if (action === 'back-hub') {
      if (App.state && App.state.seasonOver && $('#seasonScreen').classList.contains('hidden') === false) {
        showMain();
        App.view = 'hub';
        render();
      } else {
        showMain();
      }
      return;
    }
    if (action === 'skip-week') { skipWeek(); return; }
    if (action === 'prepare') { closeModal(); enterPrematch(); return; }
    if (action === 'pick-player') {
      App.pre.playerId = el.dataset.pid;
      renderPrematch();
      return;
    }
    if (action === 'pick-tactic') {
      App.pre.tactic = el.dataset.tactic;
      renderPrematch();
      return;
    }
    if (action === 'start-match') { startMatch(); return; }
    if (action === 'toggle-player') {
      App.openPlayer = App.openPlayer === el.dataset.pid ? null : el.dataset.pid;
      renderKeepScroll(render);
      return;
    }
    if (action === 'pick-program') {
      App.pending[el.dataset.pid] = el.dataset.program;
      renderKeepScroll(render);
      return;
    }
    if (action === 'auto-train') {
      const s = App.state;
      if (s.weekTrained) return;
      for (const p of s.players) {
        if (p.injury > 0) continue;
        App.pending[p.id] = p.style === 'fast' ? 'speed' : p.style === 'chop' ? 'defense' : p.style === 'control' ? 'mental' : 'spin';
      }
      renderKeepScroll(render);
      toast('已按打法安排主项，可手动调整');
      return;
    }
    if (action === 'apply-training') { applyTraining(); return; }
    if (action === 'upgrade') {
      const r = TT.upgradeFacility(App.state, el.dataset.key);
      if (!r.ok) toast(r.msg, 'bad');
      else { save(); render(); toast(`升级成功：Lv.${r.level}`, 'good'); }
      return;
    }
    if (action === 'coach') {
      if (!App.match) return;
      const r = TT.coachAction(App.match, el.dataset.coach);
      matchToast(r.msg);
      updateMatchHUD();
      return;
    }
    if (action === 'next-game') {
      $('#gameOverlay').classList.add('hidden');
      const r = App.gameOverResolve;
      App.gameOverResolve = null;
      if (r) r();
      return;
    }
    if (action === 'leave-match') {
      openModal(`
        <h3>退出比赛？</h3>
        <p class="muted" style="font-size:12px">退出将按弃权判负，并直接进入本周结算。</p>
        <button class="btn btn-warn" data-action="forfeit-match">放弃本场</button>
        <button class="btn btn-ghost" data-action="close-modal">继续比赛</button>
      `);
      return;
    }
    if (action === 'forfeit-match') { forfeitMatch(); return; }
    if (action === 'match-return') { returnFromMatch(); return; }
    if (action === 'season-summary') { showSeason(); return; }
    if (action === 'season-new') { newSeason(); return; }
    if (action === 'speed') {
      App.speed = App.speed === 1 ? 2 : App.speed === 2 ? 3 : 1;
      Court.setSpeed(App.speed);
      $('#speedBtn').textContent = App.speed + '×';
      toast(`比赛速度 ${App.speed}×`);
      return;
    }
  });

  $('#modalRoot').addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-back')) closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  /* ---------------- 启动 ---------------- */
  function boot() {
    loadSettings();
    $('#soundBtn').textContent = Sound.enabled ? '🔊' : '🔇';
    const saved = loadSave();
    if (saved) {
      $('#continueBtn').classList.remove('hidden');
      $('#continueBtn').textContent = saved.seasonOver
        ? `继续生涯 · 第 ${saved.season} 赛季总结`
        : `继续生涯 · 第 ${saved.week}/${saved.maxWeek} 周`;
    }
    showScreen('title');
    document.body.addEventListener('pointerdown', () => Sound.init(), { once: true });
  }

  boot();
})();

</script>
</body>
</html>
