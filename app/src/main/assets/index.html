<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050a13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050a13'/%3E%3Ccircle cx='34' cy='26' r='13' fill='%232fe0c0'/%3E%3Crect x='27' y='36' width='7' height='18' rx='3' fill='%23ffb454' transform='rotate(18 30 45)'/%3E%3Ccircle cx='22' cy='22' r='4' fill='%23fff'/%3E%3C/svg%3E">
<title>弧光乒乓 · 俱乐部物语</title>
<style>
:root {
  --bg: #050a13;
  --bg2: #081426;
  --panel: rgba(17, 29, 47, .82);
  --panel2: rgba(25, 40, 64, .7);
  --line: rgba(133, 172, 232, .14);
  --line2: rgba(133, 172, 232, .26);
  --text: #eaf3ff;
  --muted: #8ea5c6;
  --teal: #2fe0c0;
  --teal-dim: #139c8a;
  --orange: #ffb454;
  --red: #ff6174;
  --green: #4ee39a;
  --blue: #6ea8ff;
  --shadow: 0 14px 36px rgba(0, 0, 0, .38);
  --r: 16px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(36, 93, 160, .28), transparent 60%),
    radial-gradient(700px 400px at 110% 10%, rgba(20, 130, 120, .16), transparent 55%),
    #03060c;
  color: var(--text);
  font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  display: flex;
  justify-content: center;
  min-height: 100dvh;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }
.hidden { display: none !important; }
.mono { font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }

#app {
  position: relative;
  width: 100%;
  max-width: 540px;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: clip;
  background:
    radial-gradient(600px 300px at 50% -5%, rgba(47, 224, 192, .08), transparent 65%),
    linear-gradient(180deg, #071120 0%, #050a13 45%, #04080f 100%);
}

@media (min-width: 600px) {
  body { padding: 18px 0; align-items: flex-start; }
  .tabbar { bottom: 18px; border-radius: 0 0 26px 26px; }
  .start-bar { bottom: 18px; }
  #app {
    min-height: calc(100dvh - 36px);
    border: 1px solid var(--line);
    border-radius: 26px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, .65);
  }
}

/* ---------- 通用 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 0 18px;
  border-radius: 13px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .02em;
  background: var(--panel2);
  border: 1px solid var(--line);
  transition: transform .12s ease, filter .12s ease, background .12s ease;
}
.btn:active { transform: scale(.975); }
.btn-primary {
  color: #03211c;
  background: linear-gradient(135deg, #5ff3d5, #23c9ad);
  border-color: transparent;
  box-shadow: 0 8px 22px rgba(35, 201, 173, .3);
}
.btn-primary:disabled { filter: grayscale(.7) brightness(.6); box-shadow: none; }
.btn-ghost { background: rgba(255, 255, 255, .04); }
.btn-warn { color: #221306; background: linear-gradient(135deg, #ffd08a, #ffb454); border-color: transparent; }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 0 13px; font-size: 13px; border-radius: 11px; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 22px 2px 10px;
}
.section-head h2 {
  margin: 0;
  font-size: 16px;
  letter-spacing: .06em;
}
.section-head small { color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.muted { color: var(--muted); }
.tiny { font-size: 11px; line-height: 1.5; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .04);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
  white-space: nowrap;
}
.chip.on { color: var(--teal); border-color: rgba(47, 224, 192, .4); background: rgba(47, 224, 192, .09); }
.chip.gold { color: var(--orange); border-color: rgba(255, 180, 84, .35); background: rgba(255, 180, 84, .08); }
.chip.red { color: var(--red); border-color: rgba(255, 97, 116, .35); background: rgba(255, 97, 116, .08); }

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px 12px;
  background: linear-gradient(180deg, rgba(6, 14, 26, .96), rgba(6, 14, 26, .78) 70%, transparent);
  backdrop-filter: blur(10px);
}
.club-mark {
  width: 40px; height: 40px;
  flex: none;
  border-radius: 12px;
  display: grid; place-items: center;
  font-weight: 900; font-size: 19px;
  color: #04211d;
  background: linear-gradient(145deg, #6bf5da, #1ebba1);
  box-shadow: 0 5px 16px rgba(35, 201, 173, .28);
}
.club-info { min-width: 0; flex: 1; }
.club-info b { display: block; font-size: 15px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.club-info small { color: var(--muted); font-size: 11px; }
.top-right { display: flex; align-items: center; gap: 8px; }
.money { text-align: right; line-height: 1.15; }
.money b { display: block; font-size: 14px; color: var(--orange); font-variant-numeric: tabular-nums; }
.money small { color: var(--muted); font-size: 10px; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .04);
  display: grid; place-items: center;
  font-size: 16px;
}
.icon-btn:active { background: rgba(255, 255, 255, .1); }

/* ---------- 主区域 ---------- */
#mainScreen { display: flex; flex-direction: column; min-height: 100dvh; }
#view { flex: 1; padding: 2px 16px 96px; overflow-y: auto; scrollbar-width: none; }
#view::-webkit-scrollbar { display: none; }

.hero {
  position: relative;
  overflow: hidden;
  margin-top: 4px;
  padding: 18px;
  border-radius: 20px;
  border: 1px solid rgba(47, 224, 192, .2);
  background:
    radial-gradient(320px 160px at 100% 0%, rgba(47, 224, 192, .18), transparent 65%),
    linear-gradient(150deg, #0f2336, #0b1929 60%, #0a1524);
  box-shadow: var(--shadow);
}
.hero::after {
  content: "";
  position: absolute;
  right: -36px; bottom: -54px;
  width: 170px; height: 170px;
  border: 1px solid rgba(47, 224, 192, .16);
  border-radius: 50%;
  box-shadow: 0 0 0 22px rgba(47, 224, 192, .04), 0 0 0 44px rgba(47, 224, 192, .03);
  pointer-events: none;
}
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero-tag {
  font-size: 10px; font-weight: 800; letter-spacing: .16em;
  color: var(--teal); text-transform: uppercase;
}
.hero-week { font-size: 11px; color: var(--muted); }
.hero-main { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.hero-ovr {
  width: 62px; height: 62px; flex: none;
  border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, .045);
  border: 1px solid var(--line);
  line-height: 1;
}
.hero-ovr b { font-size: 25px; color: var(--orange); }
.hero-ovr small { font-size: 8px; color: var(--muted); letter-spacing: .14em; margin-top: 4px; }
.hero-opp { min-width: 0; flex: 1; }
.hero-opp h3 { margin: 0; font-size: 22px; letter-spacing: .03em; line-height: 1.2; }
.hero-opp p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
.hero-opp .flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.hero-actions { display: flex; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.hero-actions .btn { flex: 1; }

.quickstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
.qstat { padding: 11px 12px; border-radius: 13px; background: rgba(255, 255, 255, .035); border: 1px solid var(--line); }
.qstat small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .05em; }
.qstat b { display: block; margin-top: 4px; font-size: 15px; font-variant-numeric: tabular-nums; }

/* ---------- 球员 ---------- */
.roster { display: flex; flex-direction: column; gap: 9px; }
.player-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 15px;
  border: 1px solid var(--line);
  background: linear-gradient(160deg, rgba(24, 39, 61, .8), rgba(13, 24, 40, .8));
}
.player-avatar {
  width: 44px; height: 44px; flex: none;
  border-radius: 13px;
  display: grid; place-items: center;
  font-weight: 900; font-size: 18px;
  color: #071a2b;
  background: linear-gradient(145deg, #b9d6ff, #6ea8ff);
  position: relative;
}
.player-avatar.b { background: linear-gradient(145deg, #ffd0a8, #ff9d5c); }
.player-avatar.c { background: linear-gradient(145deg, #c6ffe9, #5ee0b5); }
.player-avatar.d { background: linear-gradient(145deg, #e6d4ff, #b08cff); }
.player-main { flex: 1; min-width: 0; }
.player-name { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.player-name b { font-size: 15px; }
.player-sub { display: flex; align-items: center; gap: 8px; margin-top: 3px; color: var(--muted); font-size: 11px; }
.ovr-badge {
  flex: none;
  width: 42px; text-align: center;
  line-height: 1.05;
}
.ovr-badge b { display: block; font-size: 20px; color: var(--teal); }
.ovr-badge small { color: var(--muted); font-size: 8px; letter-spacing: .12em; }
.bar { height: 5px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--teal); transition: width .3s ease; }
.bar.hp > i { background: linear-gradient(90deg, #2fe0c0, #6ef7dd); }
.bar.hp.low > i { background: linear-gradient(90deg, #ff9f45, #ffb454); }
.bar.hp.crit > i { background: linear-gradient(90deg, #ff4f62, #ff8c78); }
.bar.mo > i { background: linear-gradient(90deg, #6ea8ff, #a8c8ff); }
.stamina-line { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.stamina-line .bar { flex: 1; }
.stamina-line span { font-size: 10px; color: var(--muted); width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
.injury { color: var(--red); }

/* ---------- 训练 ---------- */
.train-intro {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px;
  margin: 2px 0 12px;
  border-radius: 13px;
  background: rgba(47, 224, 192, .06);
  border: 1px solid rgba(47, 224, 192, .16);
  font-size: 12px; line-height: 1.6; color: #bfe9e1;
}
.train-card { margin-bottom: 10px; overflow: hidden; }
.train-head {
  display: flex; align-items: center; gap: 12px;
  padding: 13px;
  cursor: pointer;
}
.train-head .chev { color: var(--muted); font-size: 12px; transition: transform .2s; }
.train-card.open .chev { transform: rotate(90deg); }
.train-detail { padding: 0 12px 13px; }
.program-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.program {
  text-align: left;
  padding: 10px 11px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .03);
  transition: border-color .15s, background .15s;
}
.program b { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.program b em { font-style: normal; font-size: 10px; color: var(--teal); }
.program small { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; line-height: 1.4; }
.program .cost { display: flex; gap: 8px; margin-top: 6px; font-size: 10px; color: var(--muted); }
.program .cost .neg { color: var(--orange); }
.program.selected { border-color: rgba(47, 224, 192, .55); background: rgba(47, 224, 192, .1); }
.program.selected b em { color: var(--teal); }
.program:disabled { opacity: .4; }
.training-actions { position: sticky; bottom: 8px; margin-top: 14px; }
.report-line { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.report-line:last-child { border-bottom: 0; }
.report-line .up { color: var(--teal); font-weight: 700; }

/* ---------- 设施 ---------- */
.facility { padding: 14px; margin-bottom: 10px; }
.facility-head { display: flex; align-items: center; gap: 12px; }
.facility-icon {
  width: 46px; height: 46px; flex: none;
  border-radius: 13px;
  display: grid; place-items: center;
  font-size: 21px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
}
.facility-title { flex: 1; }
.facility-title b { font-size: 15px; }
.facility-title small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
.level-pips { display: flex; gap: 4px; margin-top: 7px; }
.level-pips i { width: 18px; height: 4px; border-radius: 3px; background: rgba(255, 255, 255, .12); }
.level-pips i.on { background: var(--teal); }
.facility-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 13px; }
.facility-foot .price { font-size: 12px; color: var(--muted); }
.facility-foot .price b { color: var(--orange); font-size: 14px; }

/* ---------- 赛程 ---------- */
.round {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 13px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .025);
  margin-bottom: 8px;
}
.round .week-no {
  width: 30px; height: 30px; flex: none;
  display: grid; place-items: center;
  border-radius: 9px;
  background: rgba(255, 255, 255, .05);
  color: var(--muted);
  font-size: 11px; font-weight: 700;
}
.round .r-main { flex: 1; min-width: 0; }
.round .r-main b { font-size: 14px; }
.round .r-main small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
.round .r-res { text-align: right; font-size: 11px; flex: none; }
.round .r-res b { display: block; font-size: 15px; }
.round.done { opacity: .8; }
.round.done.win .r-res b { color: var(--teal); }
.round.done.loss .r-res b { color: var(--red); }
.round.now { border-color: rgba(255, 180, 84, .45); background: linear-gradient(120deg, rgba(255, 180, 84, .12), rgba(255, 180, 84, .02)); }
.round.now .week-no { background: var(--orange); color: #241505; }
.round.locked { opacity: .45; }

/* ---------- 底栏 ---------- */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 540px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg, rgba(5, 10, 19, .98) 55%, rgba(5, 10, 19, .86));
  border-top: 1px solid var(--line);
  backdrop-filter: blur(14px);
  z-index: 20;
}
.tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 0 5px;
  border-radius: 11px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .04em;
}
.tab i { font-size: 18px; font-style: normal; line-height: 1; filter: grayscale(.5); opacity: .8; }
.tab.active { color: var(--text); background: rgba(47, 224, 192, .08); }
.tab.active i { filter: none; opacity: 1; }
.tab.active::after {
  content: "";
  width: 14px; height: 2px; border-radius: 2px;
  background: var(--teal);
  position: absolute;
  bottom: 2px; left: 50%;
  transform: translateX(-50%);
}

/* ---------- 标题页 ---------- */
.title-screen {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 34px 24px calc(26px + env(safe-area-inset-bottom));
  position: relative;
  overflow: hidden;
}
.title-screen::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(420px 240px at 50% 12%, rgba(47, 224, 192, .16), transparent 65%),
    radial-gradient(300px 220px at 90% 50%, rgba(110, 168, 255, .1), transparent 70%);
  pointer-events: none;
}
.brand { position: relative; text-align: center; margin-top: 8px; }
.brand-kicker { font-size: 10px; letter-spacing: .42em; color: var(--teal); font-weight: 700; }
.brand h1 {
  margin: 12px 0 0;
  font-size: 46px;
  line-height: .98;
  letter-spacing: .04em;
  font-weight: 900;
  background: linear-gradient(180deg, #ffffff 20%, #9fd8ce 70%, #58bfae);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 10px 50px rgba(47, 224, 192, .16);
}
.brand h1 small { display: block; font-size: 12px; letter-spacing: .58em; margin-top: 12px; color: var(--muted); font-weight: 500; -webkit-text-fill-color: var(--muted); }
.brand p { margin: 14px auto 0; max-width: 300px; color: var(--muted); font-size: 12px; line-height: 1.7; }
.hero-art { position: relative; height: 180px; margin: 6px 0; pointer-events: none; }
.hero-table {
  position: absolute; left: 50%; top: 44%;
  width: 245px; height: 132px;
  transform: translate(-50%, -50%) perspective(500px) rotateX(56deg);
  border-radius: 8px;
  background: linear-gradient(160deg, #14776a, #0a4a43);
  border: 2px solid rgba(220, 255, 248, .55);
  box-shadow: 0 26px 50px rgba(0, 0, 0, .55), 0 0 60px rgba(47, 224, 192, .12);
}
.hero-table::before {
  content: "";
  position: absolute; left: 6%; right: 6%; top: 50%;
  height: 1px; background: rgba(255, 255, 255, .3);
}
.hero-table::after {
  content: "";
  position: absolute; left: 0; right: 0; top: 50%;
  height: 34px; transform: translateY(-100%);
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .16) 0 1px, transparent 1px 9px);
  border-top: 2px solid rgba(230, 250, 255, .7);
  opacity: .55;
}
.hero-ball {
  position: absolute; left: 50%; top: 40%;
  width: 13px; height: 13px; margin-left: -6px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #fff6cf, #ffc94d 55%, #e59510);
  box-shadow: 0 0 16px rgba(255, 201, 77, .8);
  animation: heroBounce 1.8s ease-in-out infinite;
}
@keyframes heroBounce {
  0%, 100% { transform: translate(-54px, 32px) scale(.9); opacity: .9; }
  40% { transform: translate(38px, -56px) scale(1.12); opacity: 1; }
  70% { transform: translate(62px, 6px) scale(1); }
}
.title-actions { position: relative; display: flex; flex-direction: column; gap: 10px; }
.title-actions .btn { min-height: 52px; font-size: 16px; }
.title-meta { position: relative; display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
.title-foot { position: relative; margin-top: 18px; text-align: center; color: rgba(142, 165, 198, .65); font-size: 9px; line-height: 1.7; }

/* ---------- 赛前 ---------- */
.screen-fixed {
  position: fixed; inset: 0;
  z-index: 40;
  width: 100%; max-width: 540px;
  margin: 0 auto;
  background: linear-gradient(180deg, #071120, #04080f);
  display: flex; flex-direction: column;
  overflow: hidden;
}
@media (min-width: 600px) {
  .screen-fixed { top: 18px; bottom: 18px; border-radius: 26px; border: 1px solid var(--line); }
}
.screen-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px 10px;
}
.screen-head h2 { margin: 0; font-size: 16px; letter-spacing: .05em; }
.screen-head .spacer { flex: 1; }
.screen-body { flex: 1; overflow-y: auto; padding: 4px 16px 120px; scrollbar-width: none; }
.screen-body::-webkit-scrollbar { display: none; }

.opp-banner {
  display: flex; align-items: center; gap: 15px;
  padding: 17px;
  border-radius: 19px;
  border: 1px solid rgba(110, 168, 255, .22);
  background:
    radial-gradient(260px 140px at 100% 0%, rgba(110, 168, 255, .16), transparent 65%),
    linear-gradient(150deg, #11233d, #0a1729);
}
.opp-ovr { text-align: center; flex: none; width: 66px; }
.opp-ovr b { font-size: 31px; line-height: 1; color: var(--orange); display: block; }
.opp-ovr small { font-size: 8px; letter-spacing: .16em; color: var(--muted); }
.opp-info h3 { margin: 0; font-size: 21px; }
.opp-info p { margin: 5px 0 0; font-size: 11px; color: var(--muted); }
.scout {
  margin-top: 12px;
  padding: 13px;

  background: rgba(255, 255, 255, .025);

}

.scout-stat { background: rgba(255, 255, 255, .035); border-radius: 8px; padding: 5px 8px; font-size: 10px; color: var(--muted); }
.scout-stat b { float: right; color: var(--text); font-size: 11px; }

.lineup { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.pick {
  text-align: left;
  padding: 11px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .03);

.pick .pk-top b { font-size: 13px; }
.pick .pk-top span { font-size: 15px; color: var(--teal); font-weight: 800; }
.pick .pk-sub { color: var(--muted); font-size: 10px; margin-top: 3px; }
.pick .bar { margin-top: 8px; }
.pick.injured { opacity: .5; }

.tactics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tactic {
  text-align: left;
  padding: 11px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .03);
}
.tactic.sel { border-color: rgba(255, 180, 84, .6); background: rgba(255, 180, 84, .08); }
.tactic .t-top { display: flex; justify-content: space-between; align-items: center; }
.tactic b { font-size: 13px; }
.tactic .counter { font-size: 9px; color: var(--teal); border: 1px solid rgba(47, 224, 192, .35); border-radius: 999px; padding: 1px 5px; }
.tactic small { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; line-height: 1.45; }
.tactic:last-child:nth-child(odd) { grid-column: span 2; }
.start-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 540px;
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg, #04080f 60%, rgba(4, 8, 15, .85) 85%, transparent);
  z-index: 5;
}
.start-bar .btn { width: 100%; min-height: 50px; }

/* ---------- 比赛 ---------- */
.match-screen {
  position: fixed; inset: 0; z-index: 50;

  background: #04080f;

}
@media (min-width: 600px) {

}
.match-top {

  z-index: 2;
}
.mt-row { display: flex; align-items: center; gap: 10px; }
.mt-close {
  width: 32px; height: 32px; flex: none;

}
.mt-center { flex: 1; text-align: center; }
.mt-center .round-label { font-size: 9px; letter-spacing: .18em; color: var(--muted); }
.mt-center .games-dots { display: flex; justify-content: center; gap: 5px; margin-top: 4px; }
.gd { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .16); }
.gd.a { background: var(--teal); box-shadow: 0 0 8px rgba(47, 224, 192, .5); }
.gd.b { background: var(--red); box-shadow: 0 0 8px rgba(255, 97, 116, .5); }
.mt-side { width: 74px; }
.mt-side.right { text-align: right; }
.mt-side .nm { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt-side .nat { font-size: 9px; color: var(--muted); margin-top: 2px; }
.score-row { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 2px 0 4px; }
.score-row .sc { font-size: 38px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.score-row .sc.a { color: #b8fff1; }
.score-row .sc.b { color: #ffc4cb; }
.score-row .colon { color: var(--muted); font-size: 23px; font-weight: 300; }
.serve-tag { font-size: 9px; color: var(--orange); letter-spacing: .1em; text-align: center; height: 12px; }
.stam-row { display: flex; gap: 12px; padding: 5px 2px 4px; }
.stam-side { flex: 1; }
.stam-side.right { text-align: right; }
.stam-side small { font-size: 9px; color: var(--muted); }
.stam-side .bar { margin-top: 3px; height: 4px; }
.stam-side .tac { font-size: 9px; color: var(--muted); margin-top: 2px; }
.stam-side .tac b { color: var(--text); font-weight: 600; }

.court-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#court { display: block; width: 100%; height: 100%; }
.match-toast {
  position: absolute; left: 50%; top: 12px;
  transform: translateX(-50%) translateY(-8px);
  max-width: 88%;
  padding: 8px 13px;
  border-radius: 10px;
  background: rgba(8, 18, 32, .9);
  border: 1px solid rgba(47, 224, 192, .3);
  color: #d7fff7;
  font-size: 11px;
  text-align: center;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  z-index: 5;
  backdrop-filter: blur(6px);
}
.match-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.point-flash {
  position: absolute; left: 50%; top: 42%;
  transform: translate(-50%, -50%) scale(.8);
  max-width: 88%;
  text-align: center;
  line-height: 1.3;
  font-size: 24px; font-weight: 900;
  color: var(--teal);
  text-shadow: 0 4px 26px rgba(47, 224, 192, .5);

  pointer-events: none;
  letter-spacing: .06em;
  white-space: normal;
  z-index: 4;
}
.point-flash.bad { color: var(--red); text-shadow: 0 4px 26px rgba(255, 97, 116, .45); }
.point-flash.show { animation: pflash .9s ease-out forwards; }
@keyframes pflash {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  70% { opacity: 1; transform: translate(-50%, -58%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -72%) scale(.98); }
}

.coachbar {
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));

.momentum-row .m-val { font-size: 9px; color: var(--muted); width: 22px; text-align: right; }
.coach-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.coach-btn {
  position: relative;
  min-height: 46px;

.coach-btn.ready { border-color: rgba(255, 180, 84, .5); color: var(--orange); }
.coach-btn.burst.ready { border-color: rgba(47, 224, 192, .6); color: var(--teal); animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(47, 224, 192, .25); } 50% { box-shadow: 0 0 0 6px rgba(47, 224, 192, 0); } }

.overlay {
  position: absolute; inset: 0; z-index: 30;
  display: flex; align-items: center; justify-content: center;
  padding: 22px;
  background: rgba(2, 6, 12, .78);
  backdrop-filter: blur(8px);
}
.overlay-card {
  width: 100%;

}

.overlay-card h2 { margin: 8px 0 2px; font-size: 26px; letter-spacing: .04em; }
.overlay-card .big-score { font-size: 40px; font-weight: 900; letter-spacing: .02em; margin: 8px 0 4px; }
.overlay-card .big-score .win { color: var(--teal); }
.overlay-card .big-score .lose { color: var(--red); }
.overlay-card p { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 8px 0; }
.overlay-card .btn { width: 100%; margin-top: 14px; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.result-cell { padding: 9px; border-radius: 11px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
.result-cell small { display: block; color: var(--muted); font-size: 9px; letter-spacing: .05em; }
.result-cell b { display: block; margin-top: 4px; font-size: 15px; }

/* ---------- 弹窗 / 提示 ---------- */
#modalRoot { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.modal-back {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(2, 6, 12, .65);
  backdrop-filter: blur(5px);
  pointer-events: auto;
  animation: fadeIn .18s ease;
}
@media (min-width: 600px) { .modal-back { align-items: center; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%; max-width: 460px;
  max-height: 82dvh;
  overflow-y: auto;
  border-radius: 22px 22px 0 0;
  border: 1px solid var(--line2);
  background: linear-gradient(170deg, #101f34, #08111f);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, .6);

}
@media (min-width: 600px) { .modal { border-radius: 22px; } }
@keyframes slideUp { from { transform: translateY(24px); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
.modal h3 { margin: 0 0 4px; font-size: 18px; }
.modal .m-sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
.modal .btn { width: 100%; margin-top: 10px; }
.modal-close { position: absolute; right: 14px; top: 12px; }

#toastRoot { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: 100%; max-width: 420px; padding: 0 20px; }
.toast {
  padding: 9px 14px;
  border-radius: 10px;
  background: rgba(10, 22, 39, .94);
  border: 1px solid var(--line2);
  color: var(--text);
  font-size: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  animation: toastIn .2s ease, toastOut .3s ease 2.2s forwards;
  text-align: center;
}
.toast.good { border-color: rgba(47, 224, 192, .4); }
.toast.bad { border-color: rgba(255, 97, 116, .4); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }

/* ---------- 赛季总结 ---------- */
.season-screen {
  position: fixed; inset: 0; z-index: 60;
  width: 100%; max-width: 540px; margin: 0 auto;
  overflow-y: auto;
  background:
    radial-gradient(420px 260px at 50% 0%, rgba(255, 180, 84, .16), transparent 60%),

  padding: 32px 20px calc(24px + env(safe-area-inset-bottom));
  text-align: center;
}
.season-screen .trophy { font-size: 56px; line-height: 1; filter: drop-shadow(0 10px 30px rgba(255, 180, 84, .3)); }
.season-screen h1 { margin: 12px 0 2px; font-size: 28px; letter-spacing: .04em; }
.season-screen .grade { font-size: 72px; font-weight: 900; line-height: 1; margin: 12px 0; background: linear-gradient(180deg, #ffe3a8, #ffb454 60%, #b46a12); -webkit-background-clip: text; background-clip: text; color: transparent; }
.season-screen .s-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 18px 0; text-align: left; }
.season-screen .s-stat { padding: 12px; border-radius: 13px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
.season-screen .s-stat small { display: block; color: var(--muted); font-size: 10px; }
.season-screen .s-stat b { display: block; margin-top: 4px; font-size: 17px; }

/* 帮助列表 */
.help-list { text-align: left; font-size: 12px; line-height: 1.7; color: #c6d6ee; padding-left: 18px; margin: 8px 0; }
.help-list li { margin-bottom: 6px; }
.help-list b { color: var(--teal); }
.kbd { display: inline-block; padding: 1px 5px; border-radius: 5px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font-size: 10px; }

::-webkit-scrollbar { width: 0; height: 0; }

</style>
</head>

/* 弧光乒乓 · 核心模拟引擎（纯逻辑，可在 Node 中测试） */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;

    allout: '高风险搏杀，一拍定胜负。'

  // 战术：atk/def 权重之和为 1

    },
    loop: {

      atk: { power: .45, spin: .46, speed: .09 },
      def: { power: 0, spin: 0, speed: 0 },
      atkBonus: 2, defBonus: 0, error: 0, drain: 1.1
    },
    control: {
      name: '控制', desc: '摆短劈长，等你先失误',
      atk: { power: .28, spin: .47, speed: .25 },
      def: { power: 0, spin: 0, speed: 0 },
      atkBonus: -4, defBonus: 7, error: -.022, drain: .85
    },
    chop: {
      name: '削球', desc: '退台稳削，旋转变化',
      atk: { power: .26, spin: .58, speed: .16 },
      def: { power: 0, spin: 0, speed: 0 },
      atkBonus: -7, defBonus: 12, error: -.018, drain: 1.0
    },
    allout: {
      name: '搏杀', desc: '全台爆冲，不成功便成仁',
      atk: { power: .62, spin: .28, speed: .10 },
      def: { power: 0, spin: 0, speed: 0 },
      atkBonus: 10, defBonus: -6, error: .05, drain: 1.4
    }
  };

  const PROGRAMS = {
    power: { key: 'power', name: '力量房', stat: 'power', gain: 70, stamina: -20, morale: -2, desc: '提升击球质量与杀球威力' },
    spin: { key: 'spin', name: '多球弧圈', stat: 'spin', gain: 72, stamina: -22, morale: 0, desc: '连续拉冲，提升旋转与手感' },
    speed: { key: 'speed', name: '步法冲刺', stat: 'speed', gain: 70, stamina: -24, morale: -1, desc: '交叉步与并步，覆盖更大范围' },
    defense: { key: 'defense', name: '防守对拉', stat: 'defense', gain: 72, stamina: -20, morale: 0, desc: '中远台相持，提升稳定性' },
    fitness: { key: 'fitness', name: '体能长跑', stat: 'stamina', gain: 68, stamina: -14, morale: 2, desc: '增强耐力，比赛后程不掉速' },
    mental: { key: 'mental', name: '心理辅导', stat: 'mental', gain: 64, stamina: 6, morale: 10, desc: '关键分抗压，落后时不慌' },
    rest: { key: 'rest', name: '休息调整', rest: true, stamina: 34, morale: 7, desc: '恢复体能和士气' }
  };

  const FACILITIES = {
    gym: { key: 'gym', name: '训练中心', icon: '🏓', costs: [0, 18000, 42000], max: 3, effect: (l) => `训练收益 +${(l - 1) * 15}%` },
    physio: { key: 'physio', name: '康复中心', icon: '🧊', costs: [0, 16000, 38000], max: 3, effect: (l) => `每周恢复 +${(l - 1) * 7} 体能` },
    data: { key: 'data', name: '数据球探', icon: '📈', costs: [0, 15000, 36000], max: 3, effect: (l) => l === 1 ? '查看对手总评' : l === 2 ? '查看对手打法' : '查看弱点，比赛攻击 +3' }
  };

  // 基于 2026 年第 46 周 ITTF 世界排名（男子）设计的赛事阶梯
  const OPPONENTS = [
    { name: '滨江市体校', nat: 'CHN', club: '市体校队', style: 'control', overall: 50, tag: '热身赛' },
    { name: '省青年队', nat: 'CHN', club: '省青年队', style: 'fast', overall: 54, tag: '省际邀请赛' },
    { name: '国青新星', nat: 'CHN', club: '国家青年队', style: 'loop', overall: 58, tag: '国青对抗赛' },
    { name: '卡尔德拉诺', nat: 'BRA', club: '世界排名第 7', style: 'allout', overall: 62, tag: 'WTT 挑战赛' },
    { name: '张禹珍', nat: 'KOR', club: '世界排名第 8', style: 'fast', overall: 66, tag: 'WTT 球星挑战赛' },
    { name: '林昀儒', nat: 'TPE', club: '世界排名第 5', style: 'control', overall: 70, tag: 'WTT 冠军赛' },
    { name: '王楚钦', nat: 'CHN', club: '世界排名第 4', style: 'loop', overall: 74, tag: 'WTT 大满贯' },
    { name: '松岛辉空', nat: 'JPN', club: '世界排名第 1', style: 'fast', overall: 78, tag: '世界巡回赛总决赛' }
  ];

  const MAX_WEEK = 8;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const other = (s) => (s === 'A' ? 'B' : 'A');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function overall(p) {
    const s = p.stats;
    return Math.round(
      s.power * .20 + s.spin * .18 + s.speed * .18 +
      s.defense * .20 + s.stamina * .12 + s.mental * .12
    );
  }

  function makePlayer(o) {
    const stats = {};
    for (const k of STAT_KEYS) stats[k] = clamp(Math.round(o.stats[k]), 30, 95);
    return {
      id: o.id, name: o.name, nat: o.nat || 'CHN', age: o.age || 20,
      style: o.style, hand: o.hand || 'right',
      stats, stamina: 100, morale: 68, form: 1, potential: o.potential || 85,
      progress: { power: 0, spin: 0, speed: 0, defense: 0, stamina: 0, mental: 0 },
      injury: 0, wage: o.wage || 1200, career: { w: 0, l: 0 }, note: o.note || ''
    };
  }

  function newGame(seed) {
    seed = seed || (Date.now() % 2147483647);
    const rng = mulberry32(seed);
    const players = [
      makePlayer({
        id: 'p1', name: '陈野', age: 22, style: 'loop', potential: 90, wage: 1600,
        note: '队内头号主力，正手弧圈质量高',
        stats: { power: 74, spin: 78, speed: 64, defense: 60, stamina: 68, mental: 66 }
      }),
      makePlayer({
        id: 'p2', name: '林小满', age: 19, style: 'fast', potential: 92, wage: 900,
        note: '天赋型小将，近台速度极快',
        stats: { power: 58, spin: 54, speed: 80, defense: 50, stamina: 70, mental: 58 }
      }),
      makePlayer({
        id: 'p3', name: '周子豪', age: 25, style: 'chop', potential: 82, wage: 1100,
        note: '老派削球手，越打越稳',
        stats: { power: 50, spin: 62, speed: 56, defense: 82, stamina: 74, mental: 68 }
      }),
      makePlayer({
        id: 'p4', name: '早川凛', age: 21, style: 'control', potential: 88, wage: 1300,
        note: '留洋归来的控制型选手，心理素质好',
        stats: { power: 54, spin: 65, speed: 63, defense: 72, stamina: 64, mental: 76 }
      })
    ];
    return {
      v: 1, seed, season: 1, maxWeek: MAX_WEEK, week: 1,
      clubName: '弧光俱乐部', money: 80000, rep: 0, wins: 0, losses: 0,
      players, facilities: { gym: 1, physio: 1, data: 1 },
      weekTrained: false, seasonOver: false, results: [],
      difficulty: 0, lastReport: null, champion: false
    };
  }

  const STYLE_PROFILE = {
    fast: { power: 2, spin: -4, speed: 10, defense: -5, stamina: 2, mental: 0 },
    loop: { power: 5, spin: 9, speed: -3, defense: -2, stamina: 0, mental: 0 },
    control: { power: -6, spin: 2, speed: -1, defense: 7, stamina: 1, mental: 7 },
    chop: { power: -9, spin: 0, speed: -4, defense: 13, stamina: 4, mental: 3 },
    allout: { power: 8, spin: 2, speed: 2, defense: -8, stamina: -2, mental: -4 }
  };

  function getOpponent(state, week) {
    const meta = OPPONENTS[clamp(week, 1, OPPONENTS.length) - 1];
    const rng = mulberry32(state.seed + week * 7919 + state.season * 131 + 17);
    const target = meta.overall + (state.season - 1) * 2;
    const prof = STYLE_PROFILE[meta.style];
    const stats = {};
    for (const k of STAT_KEYS) stats[k] = target + prof[k] + (rng() * 6 - 3);
    const tmp = { stats };
    const diff = target - overall(tmp);
    for (const k of STAT_KEYS) stats[k] = clamp(Math.round(stats[k] + diff), 32, 96);
    return {
      id: 'opp' + week + '_' + state.season,
      name: meta.name, nat: meta.nat, club: meta.club, tag: meta.tag,
      style: meta.style, age: 20 + Math.floor(rng() * 10),
      stats, stamina: 92 + Math.floor(rng() * 9), morale: 72, form: 1,
      potential: 95, weekly: true
    };
  }

  function facilityLevel(state, key) { return state.facilities[key] || 1; }

  function trainPlayer(state, playerId, programKey, rng) {
    const p = state.players.find((x) => x.id === playerId);
    const prog = PROGRAMS[programKey];
    if (!p || !prog) return { ok: false, msg: '参数错误' };
    if (p.injury > 0) return { ok: false, msg: `${p.name} 正在伤病恢复，无法训练` };
    const before = prog.rest ? null : p.stats[prog.stat];
    const tired = !prog.rest && p.stamina < 35;
    p.stamina = clamp(p.stamina + prog.stamina, 0, 100);
    p.morale = clamp(p.morale + (prog.morale || 0), 0, 100);
    if (prog.rest) {
      return { ok: true, player: p.name, program: prog.name, gains: [], rest: true, tired: false };
    }
    let gain = prog.gain * (1 + (facilityLevel(state, 'gym') - 1) * 0.15);
    gain *= p.age <= 20 ? 1.45 : p.age <= 24 ? 1.15 : 0.95;
    if (tired) gain *= 0.6;
    if (p.stamina < 25) gain *= 0.85;
    p.progress[prog.stat] += gain;
    const cap = Math.min(95, p.potential + 5);
    let ups = 0;
    while (p.progress[prog.stat] >= 100 && p.stats[prog.stat] < cap) {
      p.stats[prog.stat] += 1;
      p.progress[prog.stat] -= 100;
      ups++;
    }
    if (p.stats[prog.stat] >= cap) p.progress[prog.stat] = Math.min(p.progress[prog.stat], 99);
    let injury = false;
    if (p.stamina < 10 && rng() < 0.16) {
      p.injury = 1 + Math.floor(rng() * 2);
      p.morale = clamp(p.morale - 16, 0, 100);
      injury = true;
    }
    return {
      ok: true, player: p.name, program: prog.name,
      gains: ups ? [{ stat: prog.stat, label: STAT_LABEL[prog.stat], n: ups }] : [],
      tired, injury, stamina: Math.round(p.stamina)
    };
  }

  function upgradeFacility(state, key) {
    const f = FACILITIES[key];
    const lv = facilityLevel(state, key);
    if (!f || lv >= f.max) return { ok: false, msg: '已经满级' };
    const cost = f.costs[lv];
    if (state.money < cost) return { ok: false, msg: '资金不足' };
    state.money -= cost;
    state.facilities[key] = lv + 1;
    return { ok: true, level: lv + 1, cost };
  }

  function advanceWeek(state, rng) {
    const income = 4500 + Math.floor(state.rep * 180);
    const wages = state.players.reduce((s, p) => s + p.wage, 0);
    state.money += income - wages;
    const rec = 16 + facilityLevel(state, 'physio') * 7;
    for (const p of state.players) {
      p.stamina = clamp(p.stamina + rec, 0, 100);
      if (p.injury > 0) { p.injury -= 1; p.stamina = Math.max(p.stamina, 35); }
      p.morale = clamp(p.morale + (p.morale < 50 ? 5 : 1), 0, 100);
      p.form = 0.97 + rng() * 0.06;
    }
    if (state.money < 0) {
      state.money = 0;
      for (const p of state.players) p.morale = clamp(p.morale - 6, 0, 100);
    }
    state.week += 1;
    state.weekTrained = false;
    if (state.week > state.maxWeek) state.seasonOver = true;
    return { income, wages, rec };
  }

  function newSeason(state) {
    state.season += 1;
    state.week = 1;
    state.seasonOver = false;
    state.results = [];
    state.wins = 0; state.losses = 0;
    state.champion = false;
    state.difficulty = (state.difficulty || 0) + 1;
    state.weekTrained = false;
    for (const p of state.players) {
      p.age += 1;
      p.stamina = 100;
      p.morale = 65;
      p.injury = 0;
      p.form = 1;
      if (p.age >= 29) {
        for (const k of ['speed', 'stamina']) p.stats[k] = Math.max(40, p.stats[k] - 2);
      }
    }
    return state;
  }

  /* ---------------- 比赛 ---------------- */

  function snapshot(p, side, tactic, scoutBonus) {
    return {
      name: p.name, nat: p.nat, style: p.style,
      stats: Object.assign({}, p.stats),
      stamina: typeof p.stamina === 'number' ? p.stamina : 100,
      morale: typeof p.morale === 'number' ? p.morale : 70,
      form: p.form || 1,
      tactic: tactic || p.style,
      momentum: 45,
      scoutBonus: scoutBonus || 0,
      side
    };
  }

  function createMatch(playerA, playerB, format, opts) {
    opts = opts || {};
    const A = snapshot(playerA, 'A', opts.tactic, opts.scoutBonus);
    const B = snapshot(playerB, 'B', opts.aiTactic || playerB.style, 0);
    B.stamina = clamp(B.stamina, 55, 100);
    return {
      A, B,
      format: format || 3,
      target: 11,
      gamesA: 0, gamesB: 0,
      pointsA: 0, pointsB: 0,
      game: 1, serveCount: 0,
      server: 'A', firstServer: 'A',
      over: false, winner: null,
      pointIndex: 0,
      coach: { timeouts: 1, cooldown: 0, buff: null, buffUntil: 0 },
      ai: { timeouts: 1, tactic: B.tactic, cooldown: 0 },
      lastShot: null,
      stats: { A: { winners: 0, errors: 0 }, B: { winners: 0, errors: 0 } },
      log: []
    };
  }

  function staminaFactor(p) { return 0.78 + 0.22 * clamp(p.stamina, 0, 100) / 100; }
  function moraleFactor(p) { return 0.96 + clamp(p.morale, 0, 100) * 0.0006; }

  function buffFor(match, side) {
    const c = side === 'A' ? match.coach : match.ai;
    if (c.buff && match.pointIndex < c.buffUntil) return c.buff;
    return null;
  }

  function pressureBonus(match, side) {
    const mine = side === 'A' ? match.pointsA : match.pointsB;
    const theirs = side === 'A' ? match.pointsB : match.pointsA;
    if (mine >= 8 && theirs >= 8 && Math.abs(mine - theirs) <= 2) {
      return (match[side].stats.mental - 65) * 0.09;
    }
    return 0;
  }

  function counterAtk(atk, def) {
    if (atk === 'fast' && def === 'chop') return 5;
    if (atk === 'loop' && def === 'control') return 5;
    return 0;
  }
  function counterDef(def, atk) {
    if (def === 'control' && atk === 'fast') return 5;
    if (def === 'chop' && atk === 'loop') return 5;
    return 0;
  }

  function attackRating(match, side) {
    const me = match[side], foe = match[other(side)];
    const t = TACTICS[me.tactic];
    let v = me.stats.power * t.atk.power + me.stats.spin * t.atk.spin + me.stats.speed * t.atk.speed;
    v *= staminaFactor(me) * (me.form || 1) * moraleFactor(me);
    v += t.atkBonus + counterAtk(me.tactic, foe.tactic) + pressureBonus(match, side);
    v += (me.scoutBonus || 0);
    const b = buffFor(match, side);
    if (b) {
      if (b.type === 'attack') v += 8;
      if (b.type === 'burst') v += 11;
    }
    return v;
  }

  function defenseRating(match, side) {
    const me = match[side], foe = match[other(side)];
    const t = TACTICS[me.tactic];
    let v = me.stats.defense * .62 + me.stats.speed * .25 + me.stats.mental * .13;
    v *= staminaFactor(me) * (me.form || 1) * moraleFactor(me);
    v += t.defBonus + counterDef(me.tactic, foe.tactic) + pressureBonus(match, side);
    const b = buffFor(match, side);
    if (b) {
      if (b.type === 'defend') v += 8;
      if (b.type === 'burst') v += 7;
    }
    return v;
  }

  function chooseKind(match, hitter, rng) {
    const p = match[hitter];
    const t = p.tactic;
    const rally = match.pointIndex;
    if (t === 'chop') return rng() < .72 ? 'chop' : (rng() < .5 ? 'push' : 'drive');
    if (t === 'control') return rng() < .55 ? 'push' : 'loop';
    if (t === 'allout') return rng() < .62 ? 'smash' : 'drive';
    if (t === 'fast') return rng() < .42 ? 'smash' : 'drive';
    return rng() < .22 ? 'smash' : (rng() < .72 ? 'loop' : 'drive');
  }

  const DUR = { serve: 1.05, loop: .8, drive: .72, smash: .52, push: .95, chop: 1.0 };
  const KIND_LABEL = { serve: '发球', loop: '弧圈', drive: '快带', smash: '爆冲', push: '摆短', chop: '削球' };

  function chooseTarget(match, hitter, kind, rng) {
    const toFar = hitter === 'A';
    let y = toFar ? 0.13 + rng() * 0.30 : 0.57 + rng() * 0.30;
    if (kind === 'push') y = toFar ? 0.43 + rng() * 0.05 : 0.52 + rng() * 0.05;
    if (kind === 'serve') y = toFar ? 0.24 + rng() * 0.16 : 0.60 + rng() * 0.16;
    let x;
    if (kind === 'push') x = (rng() * 2 - 1) * 0.55;
    else if (kind === 'smash' || kind === 'chop') x = (rng() < .5 ? -1 : 1) * (0.55 + rng() * 0.38);
    else x = (rng() * 2 - 1) * 0.82;
    return { x: clamp(x, -1.05, 1.05), y };
  }

  function contactPoint(side, x) {
    return { x: clamp(x, -0.92, 0.92), y: side === 'A' ? 1.035 : -0.035 };
  }

  function makeShot(match, hitter, receiver, from, target, kind, outcome, rng) {
    const toFar = hitter === 'A';
    const shot = {
      hitter, receiver, kind, isServe: kind === 'serve',
      from: { x: from.x, y: from.y }, bounces: [], net: null, out: null,
      contact: null, end: outcome, duration: DUR[kind] || .8,
      label: KIND_LABEL[kind] || ''
    };
    const ownY = toFar ? .62 + rng() * .04 : .38 - rng() * .04;
    if (outcome === 'net') {
      shot.net = { x: clamp(target.x * .55, -0.75, 0.75), y: .5 };
      if (kind === 'serve') {
        shot.bounces = [{ x: from.x * .6 + shot.net.x * .4, y: ownY }];
      }
      shot.duration *= .85;
      return shot;
    }
    if (outcome === 'long') {
      if (kind === 'serve') shot.bounces = [{ x: from.x * .7, y: ownY }];
      shot.out = { x: target.x * .9, y: toFar ? -0.17 : 1.17 };
      shot.duration *= 1.04;
      return shot;
    }
    if (outcome === 'wide') {
      if (kind === 'serve') shot.bounces = [{ x: from.x * .7, y: ownY }];
      const bx = target.x > 0 ? 1.15 : -1.15;
      shot.out = { x: bx > 0 ? 1.3 : -1.3, y: target.y };
      shot.duration *= 1.0;
      return shot;
    }
    if (outcome === 'winner') {
      const second = {
        x: target.x + (target.x > 0 ? .1 : -.1),
        y: clamp(target.y + (toFar ? .04 : -.04), -0.05, 1.05)
      };
      shot.bounces = [{ x: target.x, y: target.y }, second];
      shot.out = { x: second.x + (target.x > 0 ? .08 : -.08), y: second.y };
      shot.duration *= 1.06;
      return shot;
    }
    // return
    const cp = contactPoint(receiver, target.x + (rng() * .5 - .25));
    shot.bounces = [{ x: target.x, y: target.y }];
    if (kind === 'serve') {
      const ownY = toFar ? .62 + rng() * .04 : .38 - rng() * .04;
      shot.bounces = [{ x: from.x * .7 + target.x * .3, y: ownY }, { x: target.x, y: target.y }];
    }
    shot.contact = cp;
    return shot;
  }

  function pickError(rng, strong) {
    const r = rng();
    if (strong) {
      if (r < .34) return 'net';
      if (r < .68) return 'long';
      if (r < .88) return 'wide';
      return 'winner';
    }
    if (r < .4) return 'net';
    if (r < .78) return 'long';
    if (r < .94) return 'wide';
    return 'winner';
  }

  function simulatePoint(match, rng) {
    rng = rng || Math.random;
    const server = match.server;
    let hitter = server;
    let receiver = other(server);
    const shots = [];
    let last = contactPoint(hitter, match[hitter].stats.power > 60 ? .45 : .3);
    let winner = null, reason = '', attackerError = false;
    const maxShots = 16;
    let rally = 0;
    let endKind = '';

    for (let i = 0; i < maxShots; i++) {
      rally++;
      const isServe = i === 0;
      const kind = isServe ? 'serve' : chooseKind(match, hitter, rng);
      const atk = attackRating(match, hitter);
      const def = defenseRating(match, receiver);
      const t = TACTICS[match[hitter].tactic];
      const tdef = TACTICS[match[receiver].tactic];

      // 主动失误率
      let pErr = .032 + t.error;
      if (kind === 'smash') pErr += .035;
      if (kind === 'serve') pErr = .018;
      if (match[hitter].stamina < 35) pErr += .015;
      pErr += Math.max(0, 18 - (atk - def)) * .0006;
      pErr = clamp(pErr, .008, .16);

      // 对方接不住率
      let pFail = .125 + (atk - def) * .0105;
      pFail += (match.hitter === 'A' ? 0 : 0);
      pFail += t.error * .6;
      pFail -= tdef.error * .5;
      pFail += (match[receiver].stamina < 40 ? .02 : 0);
      pFail += (match[receiver].momentum - match[hitter].momentum) * -.00045;
      if (isServe) pFail += .028;
      pFail = clamp(pFail, .035, .58);

      const target = chooseTarget(match, hitter, kind, rng);
      const roll = rng();

      if (roll < pErr) {
        const err = rng() < .55 ? 'net' : (rng() < .72 ? 'long' : 'wide');
        shots.push(makeShot(match, hitter, receiver, last, target, kind, err, rng));
        winner = receiver;
        attackerError = true;
        endKind = err;
        const errName = err === 'net' ? '下网' : err === 'long' ? '出界' : '打飞';
        reason = (isServe ? '发球失误' : `${KIND_LABEL[kind]}${errName}`);
        break;
      }
      if (roll < pErr + pFail) {
        const err = pickError(rng, atk - def > 12);
        shots.push(makeShot(match, hitter, receiver, last, target, kind, err, rng));
        winner = hitter;
        endKind = err;
        if (isServe) reason = '发球直接得分';
        else if (kind === 'smash') reason = '爆冲得分';
        else reason = `${KIND_LABEL[kind]}得分`;
        break;
      }

      const shot = makeShot(match, hitter, receiver, last, target, kind, 'return', rng);
      shots.push(shot);
      last = shot.contact;
      const tmp = hitter; hitter = receiver; receiver = tmp;
    }

    if (!winner) {
      const lastHitter = shots.length ? shots[shots.length - 1].hitter : server;
      winner = other(lastHitter);
      attackerError = true;
      reason = '体力透支，回球失误';
      if (shots.length) shots[shots.length - 1].end = 'net';
      if (shots.length) shots[shots.length - 1].net = { x: 0, y: .5 };
      endKind = 'net';
    }

    const rallyDrain = .62 + rally * .085;
    const drainA = clamp(rallyDrain * (TACTICS[match.A.tactic].drain) * (1.08 - match.A.stats.stamina / 700), .5, 4.5);
    const drainB = clamp(rallyDrain * (TACTICS[match.B.tactic].drain) * (1.08 - match.B.stats.stamina / 700), .5, 4.5);
    const winSide = winner;

    if (endKind === 'winner' && !attackerError) {
      // 记录在 applyPoint
    }

    return {
      winner, attackerError, reason, rally, shots,
      server, endKind,
      drain: { A: drainA, B: drainB },
      momentum: {
        A: winSide === 'A' ? 7 : -5,
        B: winSide === 'B' ? 7 : -5
      },
      winnerShotKind: shots.length ? shots[shots.length - 1].kind : 'serve',
      score: { A: match.pointsA, B: match.pointsB }
    };
  }

  function applyPoint(match, pt) {
    if (match.over) return { matchOver: true };
    if (pt.winner === 'A') match.pointsA++; else match.pointsB++;
    if (pt.attackerError) match.stats[pt.winner === 'A' ? 'B' : 'A'].errors++;
    else match.stats[pt.winner].winners++;
    match.A.stamina = clamp(match.A.stamina - pt.drain.A, 0, 100);
    match.B.stamina = clamp(match.B.stamina - pt.drain.B, 0, 100);
    match.A.momentum = clamp(match.A.momentum + pt.momentum.A, 0, 100);
    match.B.momentum = clamp(match.B.momentum + pt.momentum.B, 0, 100);
    match.pointIndex++;
    if (match.coach.cooldown > 0) match.coach.cooldown--;
    if (match.coach.buff && match.pointIndex >= match.coach.buffUntil) match.coach.buff = null;
    if (match.ai.buff && match.pointIndex >= match.ai.buffUntil) match.ai.buff = null;
    match.log.push({ p: `${match.pointsA}:${match.pointsB}`, w: pt.winner, r: pt.reason, rally: pt.rally });

    let gameOver = false, matchOver = false, gameWinner = null;
    const a = match.pointsA, b = match.pointsB;
    if ((a >= match.target || b >= match.target) && Math.abs(a - b) >= 2) {
      gameOver = true;
      if (a > b) { match.gamesA++; gameWinner = 'A'; } else { match.gamesB++; gameWinner = 'B'; }
      const need = Math.floor(match.format / 2) + 1;
      if (match.gamesA >= need || match.gamesB >= need) {
        matchOver = true;
        match.over = true;
        match.winner = match.gamesA > match.gamesB ? 'A' : 'B';
      }
    }

    if (!gameOver) {
      const deuce = match.pointsA >= 10 && match.pointsB >= 10;
      match.serveCount++;
      if (match.serveCount >= (deuce ? 1 : 2)) {
        match.serveCount = 0;
        match.server = other(match.server);
      }
    }
    return { gameOver, matchOver, gameWinner, matchWinner: match.winner };
  }

  function startNextGame(match) {
    if (match.over) return;
    match.pointsA = 0; match.pointsB = 0;
    match.game++;
    match.firstServer = other(match.firstServer);
    match.server = match.firstServer;
    match.serveCount = 0;
    match.coach.timeouts = 1;
    match.coach.cooldown = 0;
    match.coach.buff = null;
    match.ai.timeouts = 1;
    match.ai.buff = null;
    match.ai.cooldown = 0;
  }

  function coachAction(match, type) {
    if (match.over) return { ok: false, msg: '比赛已结束' };
    const c = match.coach;
    if (type === 'attack' || type === 'defend') {
      if (c.cooldown > 0) return { ok: false, msg: `战术冷却中（${c.cooldown} 分）` };
      c.buff = { type };
      c.buffUntil = match.pointIndex + 4;
      c.cooldown = 5;
      return { ok: true, msg: type === 'attack' ? '教练：抢攻！增加进攻压迫 4 分' : '教练：稳守！提升防守 4 分' };
    }
    if (type === 'timeout') {
      if (c.timeouts <= 0) return { ok: false, msg: '本局暂停已用完' };
      c.timeouts--;
      match.A.stamina = clamp(match.A.stamina + 9, 0, 100);
      match.A.morale = clamp(match.A.morale + 4, 0, 100);
      match.B.momentum = clamp(match.B.momentum - 28, 0, 100);
      return { ok: true, msg: '暂停：恢复体能，打断对手节奏' };
    }
    if (type === 'burst') {
      if (match.A.momentum < 99) return { ok: false, msg: '气势未满，无法爆发' };
      match.A.momentum = 0;
      c.buff = { type: 'burst' };
      c.buffUntil = match.pointIndex + 3;
      return { ok: true, msg: '气势爆发！接下来 3 分全面提升' };
    }
    return { ok: false, msg: '未知指令' };
  }

  function aiAdjust(match, rng) {
    rng = rng || Math.random;
    if (match.over) return '';
    if (match.ai.cooldown > 0) { match.ai.cooldown--; return ''; }
    let msg = '';
    if (match.ai.timeouts > 0) {
      const danger = (match.pointsB <= 9 && match.pointsA >= 10) || (match.pointsB <= 7 && match.pointsA - match.pointsB >= 5);
      if (danger && rng() < .5) {
        match.ai.timeouts--;
        match.B.stamina = clamp(match.B.stamina + 6, 0, 100);
        match.A.momentum = clamp(match.A.momentum - 16, 0, 100);
        match.ai.cooldown = 3;
        return '对手请求暂停，打断了你的节奏';
      }
    }
    if (match.pointsA - match.pointsB >= 5 && rng() < .4) {
      const counter = { fast: 'control', control: 'loop', loop: 'chop', chop: 'fast', allout: 'control' };
      const nt = counter[match.A.tactic] || 'loop';
      if (nt !== match.B.tactic) {
        match.B.tactic = nt;
        match.ai.cooldown = 9;
        msg = `对手改变战术：${TACTICS[nt].name}`;
      }
    }
    return msg;
  }

  function simulateMatch(a, b, format, rng) {
    rng = rng || Math.random;
    const m = createMatch(a, b, format);
    let guard = 0;
    while (!m.over && guard++ < 500) {
      const pt = simulatePoint(m, rng);
      const ev = applyPoint(m, pt);
      if (ev.gameOver && !ev.matchOver) startNextGame(m);
      if (!ev.matchOver) aiAdjust(m, rng);
    }
    return m;
  }

  function finishMatch(state, match, opponent) {
    const win = match.winner === 'A';
    const prize = win ? 15000 + state.week * 1500 : 5000;
    const rep = win ? 12 : 3;
    state.money += prize;
    state.rep += rep;
    if (win) state.wins++; else state.losses++;
    const p = state.players.find((x) => x.name === match.A.name);
    if (p) {
      p.stamina = clamp(match.A.stamina, 0, 100);
      p.morale = clamp(p.morale + (win ? 9 : -6), 0, 100);
      p.form = clamp(p.form + (win ? .01 : -.01), .95, 1.05);
      p.career.w += win ? 1 : 0;
      p.career.l += win ? 0 : 1;
      const xpStat = p.style === 'fast' ? 'speed' : p.style === 'chop' ? 'defense' : 'spin';
      const cap = Math.min(95, p.potential + 5);
      if (p.stats[xpStat] < cap) {
        p.progress[xpStat] += win ? 22 : 14;
        while (p.progress[xpStat] >= 100 && p.stats[xpStat] < cap) {
          p.stats[xpStat] += 1; p.progress[xpStat] -= 100;
        }
      }
    }
    const rec = {
      week: state.week, name: opponent.name, nat: opponent.nat,
      score: `${match.gamesA}:${match.gamesB}`, win,
      points: `${match.pointsA}:${match.pointsB}`, prize, rep,
      player: match.A.name
    };
    state.results.push(rec);
    state.lastReport = rec;
    if (state.week >= state.maxWeek && win && state.results.filter((r) => r.win).length >= 7) {
      state.champion = true;
    }
    return {
      win, prize, rep,
      games: `${match.gamesA}:${match.gamesB}`,
      stats: match.stats,
      stamina: Math.round(match.A.stamina),
      record: rec
    };
  }

  function seasonSummary(state) {
    const played = state.results.length;
    const wins = state.results.filter((r) => r.win).length;
    let grade = 'D';
    if (wins >= 7) grade = 'S';
    else if (wins === 6) grade = 'A';
    else if (wins === 5) grade = 'B';
    else if (wins === 4) grade = 'C';
    const byPlayer = {};
    for (const r of state.results) {
      if (r.win && r.player) byPlayer[r.player] = (byPlayer[r.player] || 0) + 1;
    }
    const ranked = Object.entries(byPlayer).sort((a, b) => b[1] - a[1]);
    let mvpName = ranked.length ? ranked[0][0] : null;
    if (!mvpName) {
      const fallback = state.players.slice().sort((a, b) => (b.career.w - b.career.l) - (a.career.w - a.career.l))[0];
      mvpName = fallback ? fallback.name : '—';
    }
    return {
      played, wins, losses: played - wins, grade,
      money: state.money, rep: state.rep,
      mvp: mvpName,
      champion: !!state.champion
    };
  }

  return {
    STAT_KEYS, STAT_LABEL, STYLE_LABEL, STYLE_DESC, TACTICS, PROGRAMS, FACILITIES,
    OPPONENTS, MAX_WEEK,
    clamp, other, mulberry32, overall,
    newGame, getOpponent, trainPlayer, upgradeFacility, advanceWeek, newSeason,
    createMatch, simulatePoint, applyPoint, startNextGame,
    coachAction, aiAdjust, simulateMatch, finishMatch, seasonSummary,
    facilityLevel
  };
});
